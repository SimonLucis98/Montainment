<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沉浸式工坊 · 蒙堂木下</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1a2e;
            font-family: 'Nunito', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color: #e8e0d8;
        }

        /* ===== 全屏 YouTube 视频背景（完美覆盖，无黑边，带加载过渡） ===== */
        .bg-video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #1a1a2e;
            opacity: 0;                     /* 初始透明，加载后淡入 */
            transition: opacity 1.5s ease;  /* 平滑过渡 */
        }
        .bg-video-wrapper.loaded {
            opacity: 1;                     /* 视频加载完成后不透明 */
        }

        .bg-video-wrapper iframe {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 177.78vh;
            height: 100vh;
            min-width: 100vw;
            min-height: 56.25vw;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: none;
        }

        /* 加载文字提示（新增） */
        .bg-video-wrapper .loading-text {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.1);
            font-size: 13px;
            letter-spacing: 3px;
            z-index: 2;
            pointer-events: none;
            font-weight: 300;
            transition: opacity 0.8s ease;
        }
        .bg-video-wrapper .loading-text.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ===== 页面内容（浮在视频上方） ===== */
        .immersive-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 40px;
            min-height: 100vh;
        }

        /* ===== 导航栏 ===== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(201, 168, 124, 0.08);
            margin-bottom: 16px;
            border-radius: 0 0 16px 16px;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            max-width: 1100px;
            margin: 0 auto;
            min-height: 56px;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: "Fredoka", "Nunito", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #e8e0d8;
            text-decoration: none;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8a9b7a, #c97a6b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 2px;
            flex-wrap: wrap;
            justify-content: center;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            padding: 6px 10px;
            border-radius: 999px;
            font-weight: 600;
            color: rgba(232, 224, 216, 0.6);
            text-decoration: none;
            transition: 0.2s;
            font-size: 14px;
            white-space: nowrap;
        }
        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(201, 168, 124, 0.12);
            color: #e8e0d8;
        }
        .nav-toggle {
            display: none;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #e8e0d8;
            font-size: 22px;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .lang-toggle-container {
            display: flex;
            align-items: center;
            gap: 0px;
            margin-left: 4px;
            padding: 0;
            flex-shrink: 0;
        }
        .lang-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: rgba(232, 224, 216, 0.6);
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            font-family: inherit;
            transition: 0.2s;
            letter-spacing: 0.3px;
        }
        .lang-btn:first-child {
            border-radius: 30px 0 0 30px;
        }
        .lang-btn:last-child {
            border-radius: 0 30px 30px 0;
            border-left: none;
        }
        .lang-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.25);
        }
        .lang-btn.active {
            background: rgba(201, 168, 124, 0.15);
            border-color: #c9a87c;
            color: #e8e0d8;
        }

        /* ===== 音乐播放器 ===== */
        .music-player {
            background: rgba(45, 42, 36, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px 8px 20px;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(201, 168, 124, 0.1);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .music-player .icon { font-size:18px; opacity:0.6; color:#c9a87c; }
        .music-player .info { display:flex; flex-direction:column; gap:0px; }
        .music-player .info .title { font-size:13px; font-weight:600; color:#e8e0d8; letter-spacing:0.5px; white-space:nowrap; }
        .music-player .info .sub { font-size:11px; color:rgba(232,224,216,0.4); letter-spacing:0.3px; }
        .music-player .controls { display:flex; align-items:center; gap:6px; }
        .music-player .controls button {
            width:32px; height:32px; border-radius:50%; border:1px solid rgba(201,168,124,0.2);
            background:rgba(255,255,255,0.04); color:#e8e0d8; font-size:14px; cursor:pointer; transition:0.2s;
            display:flex; align-items:center; justify-content:center; font-family:inherit;
        }
        .music-player .controls button:hover { background:rgba(201,168,124,0.12); border-color:rgba(201,168,124,0.3); }
        .music-player .controls button.playing { background:rgba(201,168,124,0.15); border-color:#c9a87c; }
        .music-player .controls .volume-slider {
            width:60px; height:3px; -webkit-appearance:none; background:rgba(255,255,255,0.1); border-radius:2px; outline:none; cursor:pointer;
        }
        .music-player .controls .volume-slider::-webkit-slider-thumb {
            -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:#c9a87c; cursor:pointer;
        }
        .music-player .badge {
            font-size:10px; font-weight:700; color:#c9a87c; background:rgba(201,168,124,0.08);
            padding:2px 10px; border-radius:20px; border:1px solid rgba(201,168,124,0.06); letter-spacing:0.5px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .top-bar .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #e8e0d8;
            letter-spacing: 2px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
        }
        .top-bar .page-title span {
            color: #c9a87c;
        }

        /* ===== 读物列表 ===== */
        .read-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }

        .read-card {
            background: rgba(45, 42, 36, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(201, 168, 124, 0.06);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .read-card:hover {
            transform: translateY(-4px);
            border-color: rgba(201, 168, 124, 0.2);
            background: rgba(45, 42, 36, 0.6);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .read-card .category {
            font-size: 11px;
            font-weight: 700;
            color: #c9a87c;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .read-card .title {
            font-size: 18px;
            font-weight: 700;
            color: #e8e0d8;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .read-card .author {
            font-size: 13px;
            color: rgba(232, 224, 216, 0.4);
            margin-bottom: 12px;
        }
        .read-card .preview {
            font-size: 14px;
            color: rgba(232, 224, 216, 0.6);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .read-card .badge-read {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 12px;
            color: rgba(232,224,216,0.15);
        }
        .read-card .media-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(201,168,124,0.1);
            color: #c9a87c;
            margin-bottom: 6px;
            border: 1px solid rgba(201,168,124,0.06);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(232,224,216,0.3);
            grid-column: 1 / -1;
        }
        .empty-state .icon { font-size: 56px; margin-bottom: 12px; }

        /* ===== 阅读浮层 ===== */
        .reader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .reader-overlay.active {
            display: flex;
        }
        .reader-modal {
            background: rgba(30, 28, 24, 0.95);
            border-radius: 28px;
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px 36px 40px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
            border: 1px solid rgba(201, 168, 124, 0.08);
            position: relative;
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reader-modal .close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 28px;
            color: rgba(232,224,216,0.3);
            cursor: pointer;
            padding: 0 4px;
            transition: 0.2s;
            line-height: 1;
        }
        .reader-modal .close-btn:hover {
            color: #e8e0d8;
        }
        .reader-modal .reader-category {
            font-size: 12px;
            font-weight: 700;
            color: #c9a87c;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .reader-modal .reader-title {
            font-size: 26px;
            font-weight: 800;
            color: #e8e0d8;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .reader-modal .reader-author {
            font-size: 14px;
            color: rgba(232,224,216,0.4);
            margin-bottom: 20px;
        }
        .reader-modal .reader-body {
            font-size: 17px;
            line-height: 2.2;
            color: rgba(232,224,216,0.85);
            white-space: pre-wrap;
            font-family: 'Georgia', 'Times New Roman', serif;
            border-top: 1px solid rgba(201,168,124,0.06);
            padding-top: 20px;
        }
        .reader-modal .reader-iframe-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            margin-top: 12px;
        }
        .reader-modal .reader-iframe-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            border: none;
        }
        .reader-modal .reader-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(201,168,124,0.06);
            gap: 12px;
            flex-wrap: wrap;
        }
        .reader-modal .reader-nav a {
            padding: 8px 24px;
            border: 1px solid rgba(201,168,124,0.1);
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: rgba(232,224,216,0.6);
            transition: 0.2s;
        }
        .reader-modal .reader-nav a:hover {
            background: rgba(201,168,124,0.08);
            border-color: rgba(201,168,124,0.2);
            color: #e8e0d8;
        }
        .reader-modal .reader-nav a.disabled {
            opacity: 0.2;
            pointer-events: none;
        }
        .reader-modal .reader-nav .indicator {
            font-size: 14px;
            color: rgba(232,224,216,0.3);
            display: flex;
            align-items: center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(20,20,30,0.95);
                flex-direction: column;
                align-items: stretch;
                padding: 12px 24px 20px;
                border-bottom: 1px solid rgba(201,168,124,0.06);
                display: none;
                box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            }
            .nav-links.open { display: flex; }
            .nav-links a { text-align: center; padding: 12px 16px; }
            .nav-toggle { display: block; }
            .read-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
            .reader-modal { padding: 24px 20px 28px; max-height: 90vh; }
            .reader-modal .reader-title { font-size: 20px; }
            .reader-modal .reader-body { font-size: 15px; }
            .music-player { width: 100%; justify-content: space-between; }
            .music-player .controls .volume-slider { width: 40px; }
            .top-bar .page-title { font-size: 18px; }
        }
        @media (max-width: 420px) {
            .read-grid { grid-template-columns: 1fr; gap: 12px; }
            .music-player .info .sub { display: none; }
            .music-player .controls .volume-slider { width: 30px; }
        }
    </style>
</head>
<body>

    <!-- ===== 全屏 YouTube 视频背景（增加加载过渡和超时显示） ===== -->
    <div class="bg-video-wrapper" id="bgVideoWrapper">
        <iframe
            id="bgVideo"
            src="https://www.youtube.com/embed/KjlRgSvoVhc?autoplay=1&mute=1&loop=1&playlist=KjlRgSvoVhc&controls=0&showinfo=0&rel=0&iv_load_policy=3&modestbranding=1"
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen
        ></iframe>
        <div class="loading-text" id="loadingText">✦ 加载中 · 片刻即至 ✦</div>
    </div>

    <!-- ===== 导航栏 ===== -->
    <header class="site-header">
        <nav class="nav-bar">
            <a href="index.html" class="brand">
                <span class="brand-mark">✦</span>
                Montainment · 蒙堂木下
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">首页</a></li>
                <li><a href="quiz.html" data-i18n="nav.quiz">语言测验</a></li>
                <li><a href="game.html" data-i18n="nav.game">游戏</a></li>
                <li><a href="story.html" data-i18n="nav.story">故事工坊</a></li>
                <li><a href="immersive.html" class="active" data-i18n="nav.immersive">🌙 沉浸式工坊</a></li>
            </ul>
            <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
        </nav>
    </header>

    <main>
        <div class="immersive-container">

            <div class="top-bar">
                <div class="page-title">🌙 沉浸式<span>工坊</span></div>
                <!-- ===== 音乐播放器（纯音乐，用户控制） ===== -->
                <div class="music-player" id="musicPlayer">
                    <span class="icon">🏮</span>
                    <div class="info">
                        <span class="title">茶楼听书 · 纯音乐</span>
                        <span class="sub">蒙堂木下 · 书卷气</span>
                    </div>
                    <span class="badge">🎵 背景音</span>
                    <div class="controls">
                        <button id="playBtn" aria-label="播放/暂停">▶</button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="40" aria-label="音量" />
                    </div>
                </div>
            </div>

            <div class="read-grid" id="readGrid">
                <!-- 由 JS 从 data/immersive.json 动态渲染 -->
            </div>

        </div>
    </main>

    <!-- ===== 阅读浮层 ===== -->
    <div class="reader-overlay" id="readerOverlay">
        <div class="reader-modal">
            <button class="close-btn" id="closeReader">✕</button>
            <div class="reader-category" id="readerCategory">哲思短句</div>
            <div class="reader-title" id="readerTitle">静心集 · 第一篇</div>
            <div class="reader-author" id="readerAuthor">蒙堂木下</div>
            <div class="reader-body" id="readerBody">内容加载中...</div>
            <div class="reader-nav">
                <a href="#" id="readerPrev" class="disabled">← 上一篇</a>
                <span class="indicator" id="readerIndicator">1 / 1</span>
                <a href="#" id="readerNext" class="disabled">下一篇 →</a>
            </div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script>
        // ================================================================
        //  🎬 背景视频加载 —— 监听 iframe 加载 + 超时强制显示 + 点击兜底
        // ================================================================
        (function() {
            const wrapper = document.getElementById('bgVideoWrapper');
            const iframe = document.getElementById('bgVideo');
            const loadingText = document.getElementById('loadingText');

            let shown = false;

            function showVideo() {
                if (shown) return;
                shown = true;
                wrapper.classList.add('loaded');
                // 隐藏加载文字
                if (loadingText) {
                    loadingText.classList.add('hidden');
                    // 完全移除
                    setTimeout(() => { loadingText.style.display = 'none'; }, 800);
                }
            }

            // 1. 监听 iframe 的 load 事件（部分浏览器会触发）
            if (iframe) {
                iframe.addEventListener('load', showVideo);
                // 如果 iframe 已经加载完成（但事件未触发），尝试检测
                // 注意：跨域时无法访问 contentWindow，但不影响，超时会兜底
            }

            // 2. 超时强制显示（3 秒后无论是否加载完成都显示背景，解决加载慢或事件未触发问题）
            setTimeout(showVideo, 3000);

            // 3. 用户点击页面任何位置时立即显示（增加交互响应）
            document.addEventListener('click', function() {
                showVideo();
            }, { once: true }); // 只触发一次，避免干扰

            // 4. 页面完全加载后若仍未显示，再强制一次（兜底）
            window.addEventListener('load', function() {
                setTimeout(showVideo, 200);
            });

        })();


        // ================================================================
        //  🎵 音乐播放器（纯音乐 5g_vB_qs3to，用户控制）
        // ================================================================
        (function() {
            const YOUTUBE_VIDEO_ID = '5g_vB_qs3to';
            const YOUTUBE_URL =
                `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=0&loop=1&playlist=${YOUTUBE_VIDEO_ID}&controls=0&modestbranding=1&rel=0&showinfo=0`;

            let isPlaying = false;
            let autoPlayUsed = false;
            const playBtn = document.getElementById('playBtn');
            const volumeSlider = document.getElementById('volumeSlider');

            function updateButton(state) {
                isPlaying = state;
                playBtn.textContent = state ? '⏸' : '▶';
                playBtn.classList.toggle('playing', state);
            }

            function playMusic() {
                const iframe = document.getElementById('youtubePlayer');
                if (!iframe || isPlaying) return;
                iframe.src = iframe.src.replace('autoplay=0', 'autoplay=1');
                updateButton(true);
            }

            function pauseMusic() {
                const iframe = document.getElementById('youtubePlayer');
                if (!iframe || !isPlaying) return;
                const src = iframe.src;
                iframe.src = '';
                setTimeout(() => { iframe.src = src.replace('autoplay=1', 'autoplay=0'); }, 50);
                updateButton(false);
            }

            function toggleMusic() {
                isPlaying ? pauseMusic() : playMusic();
            }

            function createPlayer() {
                const container = document.createElement('div');
                container.style.cssText = 'position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
                container.innerHTML =
                    `<iframe id="youtubePlayer" src="${YOUTUBE_URL}" width="1" height="1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                document.body.appendChild(container);

                playBtn.addEventListener('click', (e) => { e.stopPropagation();
                    toggleMusic(); });
                document.querySelector('.music-player').addEventListener('click', function(e) {
                    if (e.target.closest('button') || e.target.closest('input')) return;
                    toggleMusic();
                });

                document.addEventListener('click', function autoPlay(e) {
                    if (autoPlayUsed || isPlaying) return;
                    if (e.target.closest('.reader-overlay')) return;
                    if (e.target.closest('#playBtn') || e.target.closest('.music-player')) return;
                    playMusic();
                    autoPlayUsed = true;
                    document.removeEventListener('click', autoPlay);
                });

                volumeSlider.addEventListener('input', function() {});

                setTimeout(() => {
                    const iframe = document.getElementById('youtubePlayer');
                    if (iframe) iframe.src = iframe.src.replace('autoplay=0', 'autoplay=0');
                }, 1000);

                updateButton(false);
            }

            createPlayer();
            window.musicPlayer = { play: playMusic, pause: pauseMusic, toggle: toggleMusic };
        })();


        // ================================================================
        //  📚 读物数据（从 data/immersive.json 加载）
        // ================================================================

        let READ_DATA = [];
        let currentIndex = 0;

        const grid = document.getElementById('readGrid');
        const overlay = document.getElementById('readerOverlay');
        const closeBtn = document.getElementById('closeReader');
        const readerTitle = document.getElementById('readerTitle');
        const readerCategory = document.getElementById('readerCategory');
        const readerAuthor = document.getElementById('readerAuthor');
        const readerBody = document.getElementById('readerBody');
        const readerPrev = document.getElementById('readerPrev');
        const readerNext = document.getElementById('readerNext');
        const readerIndicator = document.getElementById('readerIndicator');

        function renderList() {
            if (!READ_DATA || READ_DATA.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🍃</div>
                        <p>暂无沉浸式内容，请在后台添加</p>
                    </div>
                `;
                return;
            }

            let html = '';
            READ_DATA.forEach((item, idx) => {
                const typeIcon = item.type === 'video' ? '🎬' : item.type === 'music' ? '🎵' : '📝';
                const typeLabel = item.type === 'video' ? '视频' : item.type === 'music' ? '音乐' : '文本';
                const preview = item.preview || (item.content ? item.content.substring(0, 60) + '...' : '');

                html += `
                    <div class="read-card" data-index="${idx}">
                        <div class="media-badge">${typeIcon} ${typeLabel}</div>
                        <div class="category">${item.category || '未分类'}</div>
                        <div class="title">${item.title}</div>
                        <div class="author">${item.author || '蒙堂木下'}</div>
                        <div class="preview">${preview}</div>
                        <div class="badge-read">📖</div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            grid.querySelectorAll('.read-card').forEach(card => {
                card.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    openReader(idx);
                });
            });
        }

        function openReader(idx) {
            const item = READ_DATA[idx];
            if (!item) return;
            currentIndex = idx;

            readerCategory.textContent = item.category || '随笔';
            readerTitle.textContent = item.title;
            readerAuthor.textContent = item.author || '蒙堂木下';

            if (item.type === 'text') {
                readerBody.innerHTML = item.content || '(内容为空)';
                const existingIframe = readerBody.querySelector('.reader-iframe-wrapper');
                if (existingIframe) existingIframe.remove();
                readerBody.style.display = 'block';
            } else if (item.type === 'video' || item.type === 'music') {
                const wrapper = document.createElement('div');
                wrapper.className = 'reader-iframe-wrapper';
                wrapper.innerHTML = `
                    <iframe src="${item.url || ''}" 
                            allow="autoplay; encrypted-media; fullscreen"
                            allowfullscreen
                            loading="lazy"
                    ></iframe>
                    <div style="text-align:center;color:rgba(232,224,216,0.3);font-size:12px;margin-top:8px;letter-spacing:0.5px;">
                        ${item.type === 'video' ? '🎬 视频内容' : '🎵 音乐播放中'}
                    </div>
                `;
                readerBody.innerHTML = '';
                readerBody.appendChild(wrapper);
                readerBody.style.display = 'block';
            } else {
                readerBody.textContent = item.content || '(内容为空)';
                readerBody.style.display = 'block';
            }

            readerIndicator.textContent = `${idx + 1} / ${READ_DATA.length}`;
            readerPrev.classList.toggle('disabled', idx === 0);
            readerNext.classList.toggle('disabled', idx === READ_DATA.length - 1);
            readerPrev.href = idx > 0 ? `#${idx - 1}` : '#';
            readerNext.href = idx < READ_DATA.length - 1 ? `#${idx + 1}` : '#';
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeReader() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function goToPrev(e) {
            e.preventDefault();
            if (currentIndex > 0) openReader(currentIndex - 1);
        }

        function goToNext(e) {
            e.preventDefault();
            if (currentIndex < READ_DATA.length - 1) openReader(currentIndex + 1);
        }

        closeBtn.addEventListener('click', closeReader);
        overlay.addEventListener('click', function(e) {
            if (e.target === this) closeReader();
        });
        readerPrev.addEventListener('click', goToPrev);
        readerNext.addEventListener('click', goToNext);

        document.addEventListener('keydown', function(e) {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') { closeReader(); return; }
            if (e.key === 'ArrowLeft') { if (currentIndex > 0) openReader(currentIndex - 1); }
            if (e.key === 'ArrowRight') { if (currentIndex < READ_DATA.length - 1) openReader(currentIndex + 1); }
        });

        function loadImmersiveData() {
            fetch('data/immersive.json')
                .then(res => {
                    if (!res.ok) throw new Error('immersive.json 不存在');
                    return res.json();
                })
                .then(data => {
                    READ_DATA = data.items || [];
                    renderList();
                })
                .catch(err => {
                    console.warn('加载沉浸式数据失败:', err);
                    READ_DATA = [];
                    renderList();
                });
        }

        // ===== 汉堡菜单 =====
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.querySelector('.nav-toggle');
            const links = document.querySelector('.nav-links');
            if (toggle && links) {
                toggle.addEventListener('click', function() {
                    links.classList.toggle('open');
                    toggle.textContent = links.classList.contains('open') ? '✕' : '☰';
                });
                links.querySelectorAll('a').forEach(function(link) {
                    link.addEventListener('click', function() {
                        links.classList.remove('open');
                        toggle.textContent = '☰';
                    });
                });
            }
        });

        // ===== 启动 =====
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadImmersiveData);
        } else {
            loadImmersiveData();
        }
    </script>

</body>
</html>
