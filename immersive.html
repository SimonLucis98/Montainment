<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沉浸式工坊 · 蒙堂木下</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1a2e;
            font-family: 'Nunito', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color: #e8e0d8;
        }

        /* ===== 动态竹林背景 ===== */
        .bamboo-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        /* 竹竿 */
        .bamboo-stalk {
            position: absolute;
            bottom: 0;
            width: 8px;
            background: linear-gradient(to top, #2d4a2d, #4a7a4a, #2d4a2d);
            border-radius: 4px 4px 0 0;
            animation: sway 4s ease-in-out infinite alternate;
            transform-origin: bottom center;
        }
        .bamboo-stalk:nth-child(1) { left: 5%; height: 70%; animation-duration: 3.5s; }
        .bamboo-stalk:nth-child(2) { left: 15%; height: 85%; animation-duration: 4.2s; animation-delay: 0.5s; width: 6px; }
        .bamboo-stalk:nth-child(3) { left: 25%; height: 60%; animation-duration: 3.8s; animation-delay: 1s; }
        .bamboo-stalk:nth-child(4) { left: 38%; height: 90%; animation-duration: 4.5s; animation-delay: 0.2s; width: 10px; }
        .bamboo-stalk:nth-child(5) { left: 50%; height: 75%; animation-duration: 3.3s; animation-delay: 0.8s; }
        .bamboo-stalk:nth-child(6) { left: 62%; height: 80%; animation-duration: 4.0s; animation-delay: 0.3s; width: 7px; }
        .bamboo-stalk:nth-child(7) { left: 75%; height: 65%; animation-duration: 3.6s; animation-delay: 1.2s; }
        .bamboo-stalk:nth-child(8) { left: 88%; height: 88%; animation-duration: 4.3s; animation-delay: 0.6s; width: 9px; }

        /* 竹节 */
        .bamboo-stalk::before {
            content: '';
            position: absolute;
            left: -2px;
            right: -2px;
            height: 3px;
            background: rgba(90, 140, 90, 0.3);
            border-radius: 2px;
            box-shadow: 0 0 10px rgba(90, 140, 90, 0.1);
        }
        .bamboo-stalk:nth-child(1)::before { top: 30%; }
        .bamboo-stalk:nth-child(1)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 60%; }
        .bamboo-stalk:nth-child(2)::before { top: 25%; }
        .bamboo-stalk:nth-child(2)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 55%; }
        .bamboo-stalk:nth-child(3)::before { top: 20%; }
        .bamboo-stalk:nth-child(3)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 50%; }
        .bamboo-stalk:nth-child(4)::before { top: 35%; }
        .bamboo-stalk:nth-child(4)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 65%; }
        .bamboo-stalk:nth-child(5)::before { top: 28%; }
        .bamboo-stalk:nth-child(5)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 58%; }
        .bamboo-stalk:nth-child(6)::before { top: 22%; }
        .bamboo-stalk:nth-child(6)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 48%; }
        .bamboo-stalk:nth-child(7)::before { top: 32%; }
        .bamboo-stalk:nth-child(7)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 62%; }
        .bamboo-stalk:nth-child(8)::before { top: 26%; }
        .bamboo-stalk:nth-child(8)::after { content: ''; position: absolute; left: -2px; right: -2px; height: 3px; background: rgba(90,140,90,0.3); border-radius:2px; top: 56%; }

        @keyframes sway {
            0% { transform: rotate(-0.8deg); }
            100% { transform: rotate(0.8deg); }
        }

        /* 竹叶（飘落） */
        .leaf {
            position: absolute;
            font-size: 20px;
            opacity: 0.4;
            animation: fall linear infinite;
            pointer-events: none;
            color: #4a7a4a;
        }
        .leaf:nth-child(1) { left: 10%; animation-duration: 12s; font-size: 16px; }
        .leaf:nth-child(2) { left: 30%; animation-duration: 15s; animation-delay: 3s; font-size: 22px; }
        .leaf:nth-child(3) { left: 50%; animation-duration: 10s; animation-delay: 5s; font-size: 18px; }
        .leaf:nth-child(4) { left: 70%; animation-duration: 14s; animation-delay: 2s; font-size: 20px; }
        .leaf:nth-child(5) { left: 85%; animation-duration: 11s; animation-delay: 7s; font-size: 16px; }
        .leaf:nth-child(6) { left: 20%; animation-duration: 13s; animation-delay: 4s; font-size: 24px; }
        .leaf:nth-child(7) { left: 60%; animation-duration: 16s; animation-delay: 1s; font-size: 18px; }
        .leaf:nth-child(8) { left: 45%; animation-duration: 9s; animation-delay: 6s; font-size: 20px; }

        @keyframes fall {
            0% { transform: translateY(-5vh) rotate(0deg) scale(1); opacity: 0; }
            10% { opacity: 0.5; }
            90% { opacity: 0.5; }
            100% { transform: translateY(105vh) rotate(720deg) scale(0.5); opacity: 0; }
        }

        /* 流水波纹（底部） */
        .water {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(to top, rgba(30,60,50,0.3), transparent);
            pointer-events: none;
        }
        .water::before {
            content: '';
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 200%;
            height: 30px;
            background: repeating-linear-gradient(90deg, transparent, rgba(100,180,160,0.05) 20px, transparent 40px);
            animation: flow 8s linear infinite;
        }
        @keyframes flow {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* ===== 页面内容 ===== */
        .immersive-container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px 20px 40px;
            min-height: 100vh;
        }

        /* ===== 导航 ===== */
        .site-header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(201, 168, 124, 0.08);
            margin-bottom: 16px;
            border-radius: 0 0 16px 16px;
        }
        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: "Fredoka", "Nunito", sans-serif;
            font-size: 20px;
            font-weight: 600;
            color: #e8e0d8;
            text-decoration: none;
        }
        .brand-mark {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: linear-gradient(135deg, #8a9b7a, #c97a6b);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 16px;
        }
        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            list-style: none;
            flex-wrap: wrap;
        }
        .nav-links a {
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 600;
            color: rgba(232, 224, 216, 0.6);
            text-decoration: none;
            transition: 0.2s;
            font-size: 14px;
        }
        .nav-links a:hover,
        .nav-links a.active {
            background: rgba(201, 168, 124, 0.12);
            color: #e8e0d8;
        }
        .nav-toggle {
            display: none;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: #e8e0d8;
            font-size: 22px;
            padding: 4px 12px;
            border-radius: 8px;
            cursor: pointer;
        }

        /* ===== 古风音乐播放器 ===== */
        .music-player {
            background: rgba(45, 42, 36, 0.6);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px 8px 20px;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(201, 168, 124, 0.1);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .music-player .icon { font-size:18px; opacity:0.6; color:#c9a87c; }
        .music-player .info { display:flex; flex-direction:column; gap:0px; }
        .music-player .info .title { font-size:13px; font-weight:600; color:#e8e0d8; letter-spacing:0.5px; white-space:nowrap; }
        .music-player .info .sub { font-size:11px; color:rgba(232,224,216,0.4); letter-spacing:0.3px; }
        .music-player .controls { display:flex; align-items:center; gap:6px; }
        .music-player .controls button {
            width:32px; height:32px; border-radius:50%; border:1px solid rgba(201,168,124,0.2);
            background:rgba(255,255,255,0.04); color:#e8e0d8; font-size:14px; cursor:pointer; transition:0.2s;
            display:flex; align-items:center; justify-content:center; font-family:inherit;
        }
        .music-player .controls button:hover { background:rgba(201,168,124,0.12); border-color:rgba(201,168,124,0.3); }
        .music-player .controls button.playing { background:rgba(201,168,124,0.15); border-color:#c9a87c; }
        .music-player .controls .volume-slider {
            width:60px; height:3px; -webkit-appearance:none; background:rgba(255,255,255,0.1); border-radius:2px; outline:none; cursor:pointer;
        }
        .music-player .controls .volume-slider::-webkit-slider-thumb {
            -webkit-appearance:none; width:10px; height:10px; border-radius:50%; background:#c9a87c; cursor:pointer;
        }
        .music-player .badge {
            font-size:10px; font-weight:700; color:#c9a87c; background:rgba(201,168,124,0.08);
            padding:2px 10px; border-radius:20px; border:1px solid rgba(201,168,124,0.06); letter-spacing:0.5px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 16px;
        }
        .top-bar .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #e8e0d8;
            letter-spacing: 2px;
        }
        .top-bar .page-title span {
            color: #c9a87c;
        }

        /* ===== 读物列表 ===== */
        .read-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-top: 8px;
        }

        .read-card {
            background: rgba(45, 42, 36, 0.4);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 24px 20px 20px;
            border: 1px solid rgba(201, 168, 124, 0.06);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }
        .read-card:hover {
            transform: translateY(-4px);
            border-color: rgba(201, 168, 124, 0.2);
            background: rgba(45, 42, 36, 0.6);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .read-card .category {
            font-size: 11px;
            font-weight: 700;
            color: #c9a87c;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .read-card .title {
            font-size: 18px;
            font-weight: 700;
            color: #e8e0d8;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .read-card .author {
            font-size: 13px;
            color: rgba(232, 224, 216, 0.4);
            margin-bottom: 12px;
        }
        .read-card .preview {
            font-size: 14px;
            color: rgba(232, 224, 216, 0.6);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .read-card .badge-read {
            position: absolute;
            top: 12px;
            right: 12px;
            font-size: 12px;
            color: rgba(232,224,216,0.15);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(232,224,216,0.3);
            grid-column: 1 / -1;
        }
        .empty-state .icon { font-size: 56px; margin-bottom: 12px; }

        /* ===== 阅读浮层 ===== */
        .reader-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }
        .reader-overlay.active {
            display: flex;
        }
        .reader-modal {
            background: rgba(30, 28, 24, 0.95);
            border-radius: 28px;
            max-width: 680px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 32px 36px 40px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.6);
            border: 1px solid rgba(201, 168, 124, 0.08);
            position: relative;
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .reader-modal .close-btn {
            position: sticky;
            top: 0;
            float: right;
            background: none;
            border: none;
            font-size: 28px;
            color: rgba(232,224,216,0.3);
            cursor: pointer;
            padding: 0 4px;
            transition: 0.2s;
            line-height: 1;
        }
        .reader-modal .close-btn:hover {
            color: #e8e0d8;
        }
        .reader-modal .reader-category {
            font-size: 12px;
            font-weight: 700;
            color: #c9a87c;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .reader-modal .reader-title {
            font-size: 26px;
            font-weight: 800;
            color: #e8e0d8;
            margin-bottom: 4px;
            line-height: 1.3;
        }
        .reader-modal .reader-author {
            font-size: 14px;
            color: rgba(232,224,216,0.4);
            margin-bottom: 20px;
        }
        .reader-modal .reader-body {
            font-size: 17px;
            line-height: 2.2;
            color: rgba(232,224,216,0.85);
            white-space: pre-wrap;
            font-family: 'Georgia', 'Times New Roman', serif;
            border-top: 1px solid rgba(201,168,124,0.06);
            padding-top: 20px;
        }
        .reader-modal .reader-nav {
            display: flex;
            justify-content: space-between;
            margin-top: 28px;
            padding-top: 20px;
            border-top: 1px solid rgba(201,168,124,0.06);
            gap: 12px;
            flex-wrap: wrap;
        }
        .reader-modal .reader-nav a {
            padding: 8px 24px;
            border: 1px solid rgba(201,168,124,0.1);
            border-radius: 30px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            color: rgba(232,224,216,0.6);
            transition: 0.2s;
        }
        .reader-modal .reader-nav a:hover {
            background: rgba(201,168,124,0.08);
            border-color: rgba(201,168,124,0.2);
            color: #e8e0d8;
        }
        .reader-modal .reader-nav a.disabled {
            opacity: 0.2;
            pointer-events: none;
        }
        .reader-modal .reader-nav .indicator {
            font-size: 14px;
            color: rgba(232,224,216,0.3);
            display: flex;
            align-items: center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 720px) {
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: rgba(20,20,30,0.95);
                flex-direction: column;
                align-items: stretch;
                padding: 12px 24px 20px;
                border-bottom: 1px solid rgba(201,168,124,0.06);
                display: none;
                box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            }
            .nav-links.open { display: flex; }
            .nav-links a { text-align: center; padding: 12px 16px; }
            .nav-toggle { display: block; }
            .read-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
            .reader-modal { padding: 24px 20px 28px; max-height: 90vh; }
            .reader-modal .reader-title { font-size: 20px; }
            .reader-modal .reader-body { font-size: 15px; }
            .music-player { width: 100%; justify-content: space-between; }
            .music-player .controls .volume-slider { width: 40px; }
            .top-bar .page-title { font-size: 18px; }
        }
        @media (max-width: 420px) {
            .read-grid { grid-template-columns: 1fr; gap: 12px; }
            .music-player .info .sub { display: none; }
            .music-player .controls .volume-slider { width: 30px; }
        }
    </style>
</head>

        const READ_DATA = [

        // ================================================================
        //  🎵 音乐播放器逻辑
        // ================================================================
        (function() {
            const YOUTUBE_VIDEO_ID = '5g_vB_qs3to';
            const YOUTUBE_URL = `https://www.youtube.com/embed/${YOUTUBE_VIDEO_ID}?autoplay=0&loop=1&playlist=${YOUTUBE_VIDEO_ID}&controls=0&modestbranding=1&rel=0&showinfo=0`;

            let isPlaying = false;
            let autoPlayUsed = false;
            const playBtn = document.getElementById('playBtn');
            const volumeSlider = document.getElementById('volumeSlider');

            function updateButton(state) {
                isPlaying = state;
                playBtn.textContent = state ? '⏸' : '▶';
                playBtn.classList.toggle('playing', state);
            }

            function playMusic() {
                const iframe = document.getElementById('youtubePlayer');
                if (!iframe || isPlaying) return;
                iframe.src = iframe.src.replace('autoplay=0', 'autoplay=1');
                updateButton(true);
            }

            function pauseMusic() {
                const iframe = document.getElementById('youtubePlayer');
                if (!iframe || !isPlaying) return;
                const src = iframe.src;
                iframe.src = '';
                setTimeout(() => { iframe.src = src.replace('autoplay=1', 'autoplay=0'); }, 50);
                updateButton(false);
            }

            function toggleMusic() {
                isPlaying ? pauseMusic() : playMusic();
            }

            function createPlayer() {
                const container = document.createElement('div');
                container.style.cssText = 'position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
                container.innerHTML = `<iframe id="youtubePlayer" src="${YOUTUBE_URL}" width="1" height="1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
                document.body.appendChild(container);

                playBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleMusic(); });
                document.querySelector('.music-player').addEventListener('click', function(e) {
                    if (e.target.closest('button') || e.target.closest('input')) return;
                    toggleMusic();
                });

                // 用户点击页面任意位置 → 自动播放（仅一次）
                document.addEventListener('click', function autoPlay(e) {
                    if (autoPlayUsed || isPlaying) return;
                    if (e.target.closest('.reader-overlay')) return;
                    if (e.target.closest('#playBtn') || e.target.closest('.music-player')) return;
                    playMusic();
                    autoPlayUsed = true;
                    document.removeEventListener('click', autoPlay);
                }, { once: false });

                volumeSlider.addEventListener('input', function() {});

                setTimeout(() => {
                    const iframe = document.getElementById('youtubePlayer');
                    if (iframe) iframe.src = iframe.src.replace('autoplay=0', 'autoplay=0');
                }, 1000);

                updateButton(false);
            }

            createPlayer();
            window.musicPlayer = { play: playMusic, pause: pauseMusic, toggle: toggleMusic };
        })();

        // ================================================================
        //  📚 读物列表 + 阅读浮层逻辑
        // ================================================================
        (function() {
            const grid = document.getElementById('readGrid');
            const overlay = document.getElementById('readerOverlay');
            const closeBtn = document.getElementById('closeReader');
            const readerTitle = document.getElementById('readerTitle');
            const readerCategory = document.getElementById('readerCategory');
            const readerAuthor = document.getElementById('readerAuthor');
            const readerBody = document.getElementById('readerBody');
            const readerPrev = document.getElementById('readerPrev');
            const readerNext = document.getElementById('readerNext');
            const readerIndicator = document.getElementById('readerIndicator');

            let currentIndex = 0;

            // 渲染列表
            function renderList() {
                if (!READ_DATA || READ_DATA.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <div class="icon">🍃</div>
                            <p>暂无读物，请等待更新</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                READ_DATA.forEach((item, idx) => {
                    const preview = item.preview || item.content.substring(0, 60) + '...';
                    html += `
                        <div class="read-card" data-index="${idx}">
                            <div class="category">${item.category || '随笔'}</div>
                            <div class="title">${item.title}</div>
                            <div class="author">${item.author || '蒙堂木下'}</div>
                            <div class="preview">${preview}</div>
                            <div class="badge-read">📖</div>
                        </div>
                    `;
                });
                grid.innerHTML = html;

                // 点击卡片 → 打开浮层
                grid.querySelectorAll('.read-card').forEach(card => {
                    card.addEventListener('click', function() {
                        const idx = parseInt(this.dataset.index);
                        openReader(idx);
                    });
                });
            }

            // 打开阅读浮层
            function openReader(idx) {
                const item = READ_DATA[idx];
                if (!item) return;
                currentIndex = idx;
                readerCategory.textContent = item.category || '随笔';
                readerTitle.textContent = item.title;
                readerAuthor.textContent = item.author || '蒙堂木下';
                readerBody.textContent = item.content;
                readerIndicator.textContent = `${idx + 1} / ${READ_DATA.length}`;
                readerPrev.classList.toggle('disabled', idx === 0);
                readerNext.classList.toggle('disabled', idx === READ_DATA.length - 1);
                readerPrev.href = idx > 0 ? `#${idx - 1}` : '#';
                readerNext.href = idx < READ_DATA.length - 1 ? `#${idx + 1}` : '#';
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            // 关闭浮层
            function closeReader() {
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // 切换到上一篇/下一篇
            function goToPrev(e) {
                e.preventDefault();
                if (currentIndex > 0) openReader(currentIndex - 1);
            }

            function goToNext(e) {
                e.preventDefault();
                if (currentIndex < READ_DATA.length - 1) openReader(currentIndex + 1);
            }

            // 事件绑定
            closeBtn.addEventListener('click', closeReader);
            overlay.addEventListener('click', function(e) {
                if (e.target === this) closeReader();
            });
            readerPrev.addEventListener('click', goToPrev);
            readerNext.addEventListener('click', goToNext);

            // 键盘事件
            document.addEventListener('keydown', function(e) {
                if (!overlay.classList.contains('active')) return;
                if (e.key === 'Escape') { closeReader(); return; }
                if (e.key === 'ArrowLeft') { if (currentIndex > 0) openReader(currentIndex - 1); }
                if (e.key === 'ArrowRight') { if (currentIndex < READ_DATA.length - 1) openReader(currentIndex + 1); }
            });

            // 初始化
            renderList();
        })();

        // ===== 汉堡菜单 =====
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.querySelector('.nav-toggle');
            const links = document.querySelector('.nav-links');
            if (toggle && links) {
                toggle.addEventListener('click', function() {
                    links.classList.toggle('open');
                    toggle.textContent = links.classList.contains('open') ? '✕' : '☰';
                });
                links.querySelectorAll('a').forEach(function(link) {
                    link.addEventListener('click', function() {
                        links.classList.remove('open');
                        toggle.textContent = '☰';
                    });
                });
            }
        });
    </script>
