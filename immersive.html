<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>沉浸式工坊 · 蒙堂木下</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ===== 原有样式保留 ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #1a1a2e;
            font-family: 'Nunito', system-ui, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            color: #e8e0d8;
        }

        /* ===== 全屏 YouTube 视频背景 ===== */
        .bg-video-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            overflow: hidden;
            background: #1a1a2e;
            opacity: 0;
            transition: opacity 1.5s ease;
        }
        .bg-video-wrapper.loaded { opacity: 1; }
        .bg-video-wrapper iframe {
            position: absolute;
            top: 50%; left: 50%;
            width: 177.78vh; height: 100vh;
            min-width: 100vw; min-height: 56.25vw;
            transform: translate(-50%, -50%);
            pointer-events: none;
            border: none;
        }
        .bg-video-wrapper .loading-text {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.1);
            font-size: 13px;
            letter-spacing: 3px;
            z-index: 2;
            pointer-events: none;
            font-weight: 300;
            transition: opacity 0.8s ease;
        }
        .bg-video-wrapper .loading-text.hidden { opacity:0; pointer-events:none; }

        /* ===== 页面内容 ===== */
        .immersive-container {
            position: relative;
            z-index: 1;
            max-width: 1400px;  /* ← 从 1280px 改为 1400px */
            margin: 0 auto;
            padding: 16px 24px 40px;
            min-height: 100vh;
        }

        /* ===== 导航栏（无变化） ===== */
        .site-header {
            position: sticky; top:0; z-index:100;
            background: rgba(20,20,30,0.6);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(201,168,124,0.08);
            margin-bottom: 16px;
            border-radius: 0 0 16px 16px;
        }
        .nav-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 16px; max-width: 1400px; margin:0 auto; min-height:56px;
        }
        .brand {
            display:flex; align-items:center; gap:8px;
            font-family:"Fredoka","Nunito",sans-serif; font-size:20px; font-weight:600;
            color:#e8e0d8; text-decoration:none; flex-shrink:0; white-space:nowrap;
        }
        .brand-mark {
            width:32px; height:32px; border-radius:10px;
            background:linear-gradient(135deg,#8a9b7a,#c97a6b);
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-size:16px;
        }
        .nav-links {
            display:flex; align-items:center; gap:2px; flex-wrap:wrap;
            list-style:none; margin:0; padding:0;
        }
        .nav-links a {
            padding:6px 10px; border-radius:999px; font-weight:600;
            color:rgba(232,224,216,0.6); text-decoration:none; transition:0.2s;
            font-size:14px; white-space:nowrap;
        }
        .nav-links a:hover, .nav-links a.active {
            background:rgba(201,168,124,0.12); color:#e8e0d8;
        }
        .nav-toggle {
            display:none; background:transparent; border:1px solid rgba(255,255,255,0.1);
            color:#e8e0d8; font-size:22px; padding:4px 12px; border-radius:8px;
            cursor:pointer; flex-shrink:0;
        }

        /* ===== 场景选择器 ===== */
        .scene-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        .scene-btn {
            padding: 10px 20px;
            border-radius: 40px;
            border: 1px solid rgba(201,168,124,0.15);
            background: rgba(45,42,36,0.4);
            backdrop-filter: blur(4px);
            color: rgba(232,224,216,0.6);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            font-family: inherit;
            letter-spacing: 0.5px;
        }
        .scene-btn:hover {
            background: rgba(201,168,124,0.12);
            border-color: rgba(201,168,124,0.3);
            color: #e8e0d8;
            transform: translateY(-2px);
        }
        .scene-btn.active {
            background: rgba(201,168,124,0.18);
            border-color: #c9a87c;
            color: #e8e0d8;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        /* ===== 音乐播放器 ===== */
        .music-player {
            background: rgba(45,42,36,0.6);
            backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 8px 16px 8px 20px;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            border: 1px solid rgba(201,168,124,0.1);
            margin-bottom: 20px;
            flex-wrap: wrap;
            width: 100%;
            justify-content: space-between;
        }
        .music-player .info {
            display: flex;
            flex-direction: column;
            gap: 0px;
            flex: 1;
            min-width: 120px;
        }
        .music-player .info .title {
            font-size: 13px;
            font-weight: 600;
            color: #e8e0d8;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }
        .music-player .info .sub {
            font-size: 11px;
            color: rgba(232,224,216,0.4);
            letter-spacing: 0.3px;
        }
        .music-player .controls {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .music-player .controls button {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: 1px solid rgba(201,168,124,0.2);
            background: rgba(255,255,255,0.04);
            color: #e8e0d8;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
        }
        .music-player .controls button:hover {
            background: rgba(201,168,124,0.12);
            border-color: rgba(201,168,124,0.3);
        }
        .music-player .controls button.playing {
            background: rgba(201,168,124,0.15);
            border-color: #c9a87c;
        }
        .music-player .controls .volume-slider {
            width: 60px; height: 3px;
            -webkit-appearance: none;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            outline: none;
            cursor: pointer;
        }
        .music-player .controls .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #c9a87c;
            cursor: pointer;
        }
        .music-player .badge-scene {
            font-size: 10px;
            font-weight: 700;
            color: #c9a87c;
            background: rgba(201,168,124,0.08);
            padding: 2px 12px;
            border-radius: 20px;
            border: 1px solid rgba(201,168,124,0.06);
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        /* ===== 两栏布局：主内容 + 侧边栏 ===== */
        .immersive-layout {
            display: flex;
            gap: 28px;
            align-items: flex-start;
        }
        .immersive-main {
            flex: 1;
            min-width: 0;
        }
        .immersive-sidebar {
            width: 260px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ===== 🆕 读物列表（主内容）—— 一行6个，卡片稍大 ===== */
        .read-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);  /* 固定6列 */
            gap: 16px;
            margin-top: 8px;
        }
        .read-card {
            background: rgba(45,42,36,0.4);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 20px 18px 18px;   /* 内边距增大 */
            border: 1px solid rgba(201,168,124,0.06);
            cursor: pointer;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .read-card:hover {
            transform: translateY(-4px);
            border-color: rgba(201,168,124,0.2);
            background: rgba(45,42,36,0.6);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .read-card .category {
            font-size: 10px;
            font-weight: 700;
            color: #c9a87c;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .read-card .title {
            font-size: 16px;        /* 字号加大 */
            font-weight: 700;
            color: #e8e0d8;
            margin-bottom: 2px;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .read-card .author {
            font-size: 12px;
            color: rgba(232,224,216,0.4);
            margin-bottom: 8px;
        }
        .read-card .preview {
            font-size: 13px;
            color: rgba(232,224,216,0.5);
            line-height: 1.5;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex: 1;
        }
        .read-card .media-badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 12px;
            background: rgba(201,168,124,0.1);
            color: #c9a87c;
            margin-bottom: 6px;
            border: 1px solid rgba(201,168,124,0.06);
            align-self: flex-start;
        }
        .read-card .card-icon {
            font-size: 36px;        /* 图标加大 */
            text-align: center;
            padding: 4px 0 8px;
            opacity: 0.6;
        }

        /* ===== 侧边栏（不变） ===== */
        .sidebar-section {
            background: rgba(45,42,36,0.3);
            backdrop-filter: blur(4px);
            border-radius: 16px;
            padding: 18px 18px 16px;
            border: 1px solid rgba(201,168,124,0.06);
        }
        .sidebar-section .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #c9a87c;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sidebar-section .section-title .badge {
            font-size: 10px;
            background: rgba(201,168,124,0.1);
            padding: 0 8px;
            border-radius: 10px;
            color: rgba(232,224,216,0.3);
        }

        .sidebar-item {
            display: flex;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid rgba(201,168,124,0.04);
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
            color: inherit;
        }
        .sidebar-item:last-child {
            border-bottom: none;
        }
        .sidebar-item:hover {
            padding-left: 4px;
            opacity: 0.8;
        }
        .sidebar-item .s-icon {
            font-size: 20px;
            flex-shrink: 0;
            width: 28px;
            text-align: center;
            opacity: 0.5;
        }
        .sidebar-item .s-info {
            flex: 1;
            min-width: 0;
        }
        .sidebar-item .s-info .s-title {
            font-size: 13px;
            font-weight: 600;
            color: #e8e0d8;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .sidebar-item .s-info .s-desc {
            font-size: 11px;
            color: rgba(232,224,216,0.3);
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .sidebar-item .s-tag {
            font-size: 9px;
            font-weight: 700;
            color: #c9a87c;
            background: rgba(201,168,124,0.06);
            padding: 0 8px;
            border-radius: 10px;
            align-self: center;
            flex-shrink: 0;
        }

        .sidebar-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .sidebar-tags .tag {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(201,168,124,0.06);
            color: rgba(232,224,216,0.4);
            border: 1px solid rgba(201,168,124,0.04);
            cursor: pointer;
            transition: 0.2s;
        }
        .sidebar-tags .tag:hover {
            background: rgba(201,168,124,0.12);
            color: #e8e0d8;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: rgba(232,224,216,0.3);
            grid-column: 1 / -1;
        }
        .empty-state .icon { font-size: 56px; margin-bottom: 12px; }

        /* ===== 阅读浮层（不变） ===== */
        .reader-overlay {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.7);
            backdrop-filter:blur(8px);
            z-index:200;
            justify-content:center; align-items:center;
            padding:24px;
        }
        .reader-overlay.active { display:flex; }
        .reader-modal {
            background:rgba(30,28,24,0.95);
            border-radius:28px;
            max-width:680px; width:100%; max-height:85vh; overflow-y:auto;
            padding:32px 36px 40px;
            box-shadow:0 24px 64px rgba(0,0,0,0.6);
            border:1px solid rgba(201,168,124,0.08);
            position:relative;
            animation:fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }
        .reader-modal .close-btn {
            position:sticky; top:0; float:right;
            background:none; border:none;
            font-size:28px; color:rgba(232,224,216,0.3);
            cursor:pointer; padding:0 4px; transition:0.2s; line-height:1;
        }
        .reader-modal .close-btn:hover { color:#e8e0d8; }
        .reader-modal .reader-category {
            font-size:12px; font-weight:700; color:#c9a87c;
            letter-spacing:1px; text-transform:uppercase; margin-bottom:8px;
        }
        .reader-modal .reader-title {
            font-size:26px; font-weight:800; color:#e8e0d8;
            margin-bottom:4px; line-height:1.3;
        }
        .reader-modal .reader-author {
            font-size:14px; color:rgba(232,224,216,0.4); margin-bottom:20px;
        }
        .reader-modal .reader-body {
            font-size:17px; line-height:2.2; color:rgba(232,224,216,0.85);
            white-space:pre-wrap; font-family:'Georgia','Times New Roman',serif;
            border-top:1px solid rgba(201,168,124,0.06); padding-top:20px;
        }
        .reader-modal .reader-iframe-wrapper {
            position:relative; padding-bottom:56.25%; height:0; margin-top:12px;
        }
        .reader-modal .reader-iframe-wrapper iframe {
            position:absolute; top:0; left:0; width:100%; height:100%;
            border-radius:12px; border:none;
        }
        .reader-modal .reader-nav {
            display:flex; justify-content:space-between; margin-top:28px;
            padding-top:20px; border-top:1px solid rgba(201,168,124,0.06);
            gap:12px; flex-wrap:wrap;
        }
        .reader-modal .reader-nav a {
            padding:8px 24px; border:1px solid rgba(201,168,124,0.1);
            border-radius:30px; text-decoration:none; font-size:14px;
            font-weight:600; color:rgba(232,224,216,0.6); transition:0.2s;
        }
        .reader-modal .reader-nav a:hover {
            background:rgba(201,168,124,0.08); border-color:rgba(201,168,124,0.2);
            color:#e8e0d8;
        }
        .reader-modal .reader-nav a.disabled {
            opacity:0.2; pointer-events:none;
        }
        .reader-modal .reader-nav .indicator {
            font-size:14px; color:rgba(232,224,216,0.3);
            display:flex; align-items:center;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1200px) {
            .read-grid {
                grid-template-columns: repeat(5, 1fr); /* 中等屏幕变5列 */
            }
        }
        @media (max-width: 992px) {
            .immersive-sidebar {
                width: 220px;
            }
            .read-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }
        @media (max-width: 820px) {
            .immersive-layout {
                flex-direction: column;
            }
            .immersive-sidebar {
                width: 100%;
                position: static;
                flex-direction: row;
                flex-wrap: wrap;
                gap: 16px;
            }
            .immersive-sidebar .sidebar-section {
                flex: 1;
                min-width: 200px;
            }
            .read-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 720px) {
            .nav-links {
                position:absolute; top:100%; left:0; right:0;
                background:rgba(20,20,30,0.95);
                flex-direction:column; align-items:stretch;
                padding:12px 24px 20px;
                border-bottom:1px solid rgba(201,168,124,0.06);
                display:none; box-shadow:0 8px 24px rgba(0,0,0,0.3);
            }
            .nav-links.open { display:flex; }
            .nav-links a { text-align:center; padding:12px 16px; }
            .nav-toggle { display:block; }
            .read-grid { grid-template-columns:1fr 1fr; gap:14px; }
            .reader-modal { padding:24px 20px 28px; max-height:90vh; }
            .reader-modal .reader-title { font-size:20px; }
            .reader-modal .reader-body { font-size:15px; }
            .music-player { width:100%; justify-content:space-between; }
            .music-player .controls .volume-slider { width:40px; }
            .scene-btn { padding:8px 16px; font-size:13px; }
            .immersive-container { padding: 12px 16px 32px; }
            .immersive-sidebar .sidebar-section {
                min-width: 100%;
            }
        }
        @media (max-width: 420px) {
            .read-grid { grid-template-columns:1fr 1fr; gap:10px; }
            .music-player .info .sub { display:none; }
            .music-player .controls .volume-slider { width:30px; }
            .scene-btn { padding:6px 12px; font-size:12px; }
            .read-card { padding: 14px 12px; }
            .read-card .title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <!-- ===== 全屏 YouTube 视频背景 ===== -->
    <div class="bg-video-wrapper" id="bgVideoWrapper">
        <iframe
            id="bgVideo"
            src=""
            frameborder="0"
            allow="autoplay; encrypted-media"
            allowfullscreen
        ></iframe>
        <div class="loading-text" id="loadingText">✦ 加载中 · 片刻即至 ✦</div>
    </div>

    <!-- ===== 导航栏 ===== -->
    <header class="site-header">
        <nav class="nav-bar">
            <a href="index.html" class="brand">
                <span class="brand-mark">✦</span>
                Montainment · 蒙堂木下
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">首页</a></li>
                <li><a href="quiz.html" data-i18n="nav.quiz">语言测验</a></li>
                <li><a href="game.html" data-i18n="nav.game">游戏</a></li>
                <li><a href="story.html" data-i18n="nav.story">故事工坊</a></li>
                <li><a href="immersive.html" class="active" data-i18n="nav.immersive">🌙 沉浸式工坊</a></li>
            </ul>
            <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
        </nav>
    </header>

    <main>
        <div class="immersive-container">

            <!-- ===== 场景选择按钮 ===== -->
            <div class="scene-selector" id="sceneSelector">
                <!-- 由 JS 动态生成 -->
            </div>

            <!-- ===== 顶部标题 + 音乐播放器 ===== -->
            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:6px;">
                <div class="page-title" data-i18n-html="immersive.title" style="font-size:22px; font-weight:700; color:#e8e0d8; letter-spacing:2px; text-shadow:0 2px 20px rgba(0,0,0,0.3);">
                    🌙 沉浸式<span style="color:#c9a87c;">工坊</span>
                </div>
            </div>

            <div class="music-player" id="musicPlayer">
                <span class="icon">🏮</span>
                <div class="info">
                    <span class="title" id="musicTitle">茶楼听书 · 纯音乐</span>
                    <span class="sub" id="musicSub">蒙堂木下 · 书卷气</span>
                </div>
                <span class="badge-scene" id="sceneBadge">🎵 当前场景</span>
                <div class="controls">
                    <button id="playBtn" aria-label="播放/暂停">▶</button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="40" aria-label="音量" />
                </div>
            </div>

            <!-- ===== 两栏布局：主内容 + 侧边栏 ===== -->
            <div class="immersive-layout">

                <!-- 主内容区 -->
                <div class="immersive-main">
                    <div class="read-grid" id="readGrid">
                        <!-- 由 JS 从 data/immersive.json 动态渲染 -->
                    </div>
                </div>

                <!-- 侧边栏 -->
                <aside class="immersive-sidebar" id="sidebar">
                    <!-- 热门推荐 -->
                    <div class="sidebar-section" id="hotSection">
                        <div class="section-title">🔥 <span data-i18n="immersive.hot">热门推荐</span> <span class="badge">TOP</span></div>
                        <div id="hotList"></div>
                    </div>

                    <!-- 分类标签 -->
                    <div class="sidebar-section">
                        <div class="section-title">🏷️ <span data-i18n="immersive.categories">分类</span></div>
                        <div class="sidebar-tags" id="categoryTags"></div>
                    </div>
                </aside>

            </div>

        </div>
    </main>

    <!-- ===== 阅读浮层 ===== -->
    <div class="reader-overlay" id="readerOverlay">
        <div class="reader-modal">
            <button class="close-btn" id="closeReader">✕</button>
            <div class="reader-category" id="readerCategory">哲思短句</div>
            <div class="reader-title" id="readerTitle">静心集 · 第一篇</div>
            <div class="reader-author" id="readerAuthor">蒙堂木下</div>
            <div class="reader-body" id="readerBody">内容加载中...</div>
            <div class="reader-nav">
                <a href="#" id="readerPrev" class="disabled">← 上一篇</a>
                <span class="indicator" id="readerIndicator">1 / 1</span>
                <a href="#" id="readerNext" class="disabled">下一篇 →</a>
            </div>
        </div>
    </div>

    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script>
        // ================================================================
        //  🎬 背景视频加载与切换
        // ================================================================
        const bgWrapper = document.getElementById('bgVideoWrapper');
        const bgIframe = document.getElementById('bgVideo');
        const loadingText = document.getElementById('loadingText');
        let bgLoaded = false;

        function showBgVideo() {
            if (bgLoaded) return;
            bgLoaded = true;
            bgWrapper.classList.add('loaded');
            if (loadingText) {
                loadingText.classList.add('hidden');
                setTimeout(() => { loadingText.style.display = 'none'; }, 800);
            }
        }

        bgIframe.addEventListener('load', showBgVideo);
        setTimeout(showBgVideo, 3000);
        document.addEventListener('click', showBgVideo, { once: true });
        window.addEventListener('load', () => setTimeout(showBgVideo, 200));

        function switchBackground(videoId) {
            const newSrc = `https://www.youtube.com/embed/${videoId}?autoplay=1&mute=1&loop=1&playlist=${videoId}&controls=0&showinfo=0&rel=0&iv_load_policy=3&modestbranding=1`;
            bgIframe.src = newSrc;
            bgLoaded = false;
            bgWrapper.classList.remove('loaded');
            if (loadingText) {
                loadingText.style.display = 'block';
                loadingText.classList.remove('hidden');
            }
            bgIframe.addEventListener('load', showBgVideo);
            setTimeout(showBgVideo, 3000);
        }

        // ================================================================
        //  🎵 音乐播放器
        // ================================================================
        let musicPlayer = null;
        let currentMusicId = '';
        let isPlaying = false;
        let autoPlayUsed = false;

        const playBtn = document.getElementById('playBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const musicTitleEl = document.getElementById('musicTitle');
        const musicSubEl = document.getElementById('musicSub');
        const sceneBadge = document.getElementById('sceneBadge');

        function createMusicPlayer() {
            const container = document.createElement('div');
            container.style.cssText = 'position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
            container.innerHTML = `<iframe id="youtubeMusicPlayer" src="" width="1" height="1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
            document.body.appendChild(container);
            musicPlayer = document.getElementById('youtubeMusicPlayer');
        }

        function updateMusicInfo(scene) {
            const lang = localStorage.getItem('lang') || 'zh';
            if (lang === 'zh') {
                musicTitleEl.textContent = scene.musicTitleZh || scene.nameZh;
                musicSubEl.textContent = scene.musicSubZh || '蒙堂木下';
                sceneBadge.textContent = '🎵 ' + scene.nameZh;
            } else {
                musicTitleEl.textContent = scene.musicTitleEn || scene.nameEn;
                musicSubEl.textContent = scene.musicSubEn || 'Montainment';
                sceneBadge.textContent = '🎵 ' + scene.nameEn;
            }
        }

        function switchMusic(videoId, scene) {
            if (!musicPlayer) createMusicPlayer();
            currentMusicId = videoId;
            const src = `https://www.youtube.com/embed/${videoId}?autoplay=1&loop=1&playlist=${videoId}&controls=0&modestbranding=1&rel=0&showinfo=0`;
            musicPlayer.src = src;
            updateMusicInfo(scene);
            isPlaying = true;
            playBtn.textContent = '⏸';
            playBtn.classList.add('playing');
        }

        function togglePlay() {
            if (!musicPlayer) return;
            if (isPlaying) {
                const src = musicPlayer.src;
                if (src.includes('autoplay=1')) {
                    const newSrc = src.replace('autoplay=1', 'autoplay=0');
                    musicPlayer.src = newSrc;
                } else {
                    const newSrc = src.replace('autoplay=0', 'autoplay=1');
                    musicPlayer.src = newSrc;
                }
                isPlaying = !isPlaying;
            } else {
                const src = musicPlayer.src;
                if (src.includes('autoplay=0')) {
                    musicPlayer.src = src.replace('autoplay=0', 'autoplay=1');
                } else {
                    if (!src || src === 'about:blank') {
                        if (currentMusicId) {
                            musicPlayer.src =
                                `https://www.youtube.com/embed/${currentMusicId}?autoplay=1&loop=1&playlist=${currentMusicId}&controls=0&modestbranding=1&rel=0&showinfo=0`;
                        }
                    } else {
                        musicPlayer.src = src + '&autoplay=1';
                    }
                }
                isPlaying = true;
            }
            playBtn.textContent = isPlaying ? '⏸' : '▶';
            playBtn.classList.toggle('playing', isPlaying);
        }

        volumeSlider.addEventListener('input', function() {});

        playBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            togglePlay();
        });

        document.querySelector('.music-player').addEventListener('click', function(e) {
            if (e.target.closest('button') || e.target.closest('input')) return;
            togglePlay();
        });

        document.addEventListener('click', function autoPlayMusic(e) {
            if (autoPlayUsed || isPlaying) return;
            if (e.target.closest('.reader-overlay')) return;
            if (e.target.closest('#playBtn') || e.target.closest('.music-player')) return;
            if (!musicPlayer || !currentMusicId) return;
            musicPlayer.src =
                `https://www.youtube.com/embed/${currentMusicId}?autoplay=1&loop=1&playlist=${currentMusicId}&controls=0&modestbranding=1&rel=0&showinfo=0`;
            isPlaying = true;
            playBtn.textContent = '⏸';
            playBtn.classList.add('playing');
            autoPlayUsed = true;
            document.removeEventListener('click', autoPlayMusic);
        });

        // ================================================================
        //  🔄 场景配置与切换
        // ================================================================
        const SCENES = [
            {
                id: 'cafe',
                nameZh: '☕ 咖啡馆',
                nameEn: 'Café',
                bgVideoId: 'o53Ow2MBLVk',
                musicVideoId: 'cvL4wbvHNA8',
                musicTitleZh: '咖啡馆 · 轻柔钢琴',
                musicTitleEn: 'Café Soft Piano',
                musicSubZh: '蒙堂木下 · 慵懒午后',
                musicSubEn: 'Montainment · Lazy Afternoon'
            },
            {
                id: 'fireplace',
                nameZh: '🔥 壁炉',
                nameEn: 'Fireplace',
                bgVideoId: 'jq7-Pib4UYw',
                musicVideoId: 'iQH-C2UTLeE',
                musicTitleZh: '壁炉 · 冬日暖阳',
                musicTitleEn: 'Fireplace · Winter Sun',
                musicSubZh: '蒙堂木下 · 温暖静谧',
                musicSubEn: 'Montainment · Warm & Quiet'
            },
            {
                id: 'forest',
                nameZh: '🌲 森林',
                nameEn: 'Forest',
                bgVideoId: 'KS4zA8nGL1U',
                musicVideoId: 'hHEFUieyXzQ',
                musicTitleZh: '森林 · 溪水潺潺',
                musicTitleEn: 'Forest · Stream',
                musicSubZh: '蒙堂木下 · 自然之声',
                musicSubEn: 'Montainment · Nature Sounds'
            },
            {
                id: 'study',
                nameZh: '📖 书斋',
                nameEn: 'Study',
                bgVideoId: 'z0dtCkTcOEU',
                musicVideoId: '5g_vB_qs3to',
                musicTitleZh: '书斋 · 雨打芭蕉',
                musicTitleEn: 'Study · Rain & Guqin',
                musicSubZh: '蒙堂木下 · 静心研读',
                musicSubEn: 'Montainment · Deep Reading'
            },
            {
                id: 'rainy_night',
                nameZh: '🌧️ 雨夜',
                nameEn: 'Rainy Night',
                bgVideoId: 'EeSZ6QwWZWE',
                musicVideoId: 'Qj1xtBAiPtI',
                musicTitleZh: '雨夜 · 城市灯光',
                musicTitleEn: 'Rainy Night · City Lights',
                musicSubZh: '蒙堂木下 · 孤独浪漫',
                musicSubEn: 'Montainment · Lonely Romance'
            }
        ];

        let currentSceneId = SCENES[0]?.id || '';

        function switchScene(sceneId) {
            const scene = SCENES.find(s => s.id === sceneId);
            if (!scene) return;
            currentSceneId = sceneId;
            switchBackground(scene.bgVideoId);
            switchMusic(scene.musicVideoId, scene);
            document.querySelectorAll('.scene-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.scene === sceneId);
            });
        }

        function renderSceneButtons() {
            const container = document.getElementById('sceneSelector');
            const lang = localStorage.getItem('lang') || 'zh';
            let html = '';
            SCENES.forEach(scene => {
                const label = lang === 'zh' ? scene.nameZh : scene.nameEn;
                html += `
                    <button class="scene-btn" data-scene="${scene.id}">
                        ${label}
                    </button>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.scene-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.scene;
                    switchScene(id);
                });
            });
            if (SCENES.length > 0) {
                const first = SCENES[0];
                const firstBtn = container.querySelector(`[data-scene="${first.id}"]`);
                if (firstBtn) firstBtn.classList.add('active');
                switchScene(first.id);
            }
        }

        // ================================================================
        //  📚 读物数据 + 侧边栏
        // ================================================================
        let READ_DATA = [];
        let currentIndex = 0;
        const grid = document.getElementById('readGrid');
        const overlay = document.getElementById('readerOverlay');
        const closeBtn = document.getElementById('closeReader');
        const readerTitle = document.getElementById('readerTitle');
        const readerCategory = document.getElementById('readerCategory');
        const readerAuthor = document.getElementById('readerAuthor');
        const readerBody = document.getElementById('readerBody');
        const readerPrev = document.getElementById('readerPrev');
        const readerNext = document.getElementById('readerNext');
        const readerIndicator = document.getElementById('readerIndicator');

        function getTypeLabel(type) {
            if (type === 'video') return i18n.t('immersive.type_video');
            if (type === 'music') return i18n.t('immersive.type_music');
            return i18n.t('immersive.type_text');
        }

        // ===== 侧边栏：热门推荐 =====
        function renderHot() {
            const container = document.getElementById('hotList');
            const hotItems = READ_DATA.slice(0, 4);
            if (hotItems.length === 0) {
                container.innerHTML = '<div style="color:rgba(232,224,216,0.2);font-size:13px;">暂无内容</div>';
                return;
            }
            let html = '';
            hotItems.forEach(item => {
                const icon = item.type === 'video' ? '🎬' : item.type === 'music' ? '🎵' : '📝';
                const tag = item.type === 'video' ? '视频' : item.type === 'music' ? '音乐' : '文本';
                html += `
                    <div class="sidebar-item" data-idx="${READ_DATA.indexOf(item)}">
                        <span class="s-icon">${icon}</span>
                        <div class="s-info">
                            <div class="s-title">${item.title}</div>
                            <div class="s-desc">${item.author || '蒙堂木下'}</div>
                        </div>
                        <span class="s-tag">${tag}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
            container.querySelectorAll('.sidebar-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    if (!isNaN(idx)) openReader(idx);
                });
            });
        }

        // ===== 侧边栏：分类标签 =====
        function renderCategories() {
            const container = document.getElementById('categoryTags');
            const cats = [...new Set(READ_DATA.map(item => item.category).filter(Boolean))];
            if (cats.length === 0) {
                container.innerHTML = '<span style="color:rgba(232,224,216,0.2);font-size:13px;">暂无分类</span>';
                return;
            }
            let html = '';
            cats.forEach(cat => {
                html += `<span class="tag">${cat}</span>`;
            });
            container.innerHTML = html;
        }

        // ===== 主列表渲染 =====
        function renderList() {
            if (!READ_DATA || READ_DATA.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">🍃</div>
                        <p data-i18n="immersive.empty">暂无沉浸式内容，请在后台添加</p>
                    </div>
                `;
                applyI18n();
                renderHot();
                renderCategories();
                return;
            }

            let html = '';
            READ_DATA.forEach((item, idx) => {
                const typeIcon = item.type === 'video' ? '🎬' : item.type === 'music' ? '🎵' : '📝';
                const typeLabel = getTypeLabel(item.type);
                const preview = item.preview || (item.content ? item.content.substring(0, 50) + '...' : '');
                html += `
                    <div class="read-card" data-index="${idx}">
                        <div class="card-icon">${typeIcon}</div>
                        <div class="media-badge">${typeLabel}</div>
                        <div class="category">${item.category || '未分类'}</div>
                        <div class="title">${item.title}</div>
                        <div class="author">${item.author || '蒙堂木下'}</div>
                        <div class="preview">${preview}</div>
                    </div>
                `;
            });
            grid.innerHTML = html;

            grid.querySelectorAll('.read-card').forEach(card => {
                card.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    openReader(idx);
                });
            });

            applyI18n();
            renderHot();
            renderCategories();
        }

        // ===== 阅读浮层 =====
        function openReader(idx) {
            const item = READ_DATA[idx];
            if (!item) return;
            currentIndex = idx;
            readerCategory.textContent = item.category || '随笔';
            readerTitle.textContent = item.title;
            readerAuthor.textContent = item.author || '蒙堂木下';
            if (item.type === 'text') {
                readerBody.innerHTML = item.content || '(内容为空)';
                const existingIframe = readerBody.querySelector('.reader-iframe-wrapper');
                if (existingIframe) existingIframe.remove();
                readerBody.style.display = 'block';
            } else if (item.type === 'video' || item.type === 'music') {
                const wrapper = document.createElement('div');
                wrapper.className = 'reader-iframe-wrapper';
                wrapper.innerHTML = `
                    <iframe src="${item.url || ''}" 
                            allow="autoplay; encrypted-media; fullscreen"
                            allowfullscreen
                            loading="lazy"
                    ></iframe>
                    <div style="text-align:center;color:rgba(232,224,216,0.3);font-size:12px;margin-top:8px;letter-spacing:0.5px;">
                        ${item.type === 'video' ? '🎬 ' + i18n.t('immersive.type_video') : '🎵 ' + i18n.t('immersive.type_music')}
                    </div>
                `;
                readerBody.innerHTML = '';
                readerBody.appendChild(wrapper);
                readerBody.style.display = 'block';
            } else {
                readerBody.textContent = item.content || '(内容为空)';
                readerBody.style.display = 'block';
            }
            readerIndicator.textContent = `${idx + 1} / ${READ_DATA.length}`;
            readerPrev.classList.toggle('disabled', idx === 0);
            readerNext.classList.toggle('disabled', idx === READ_DATA.length - 1);
            readerPrev.href = idx > 0 ? `#${idx - 1}` : '#';
            readerNext.href = idx < READ_DATA.length - 1 ? `#${idx + 1}` : '#';
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeReader() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        function goToPrev(e) {
            e.preventDefault();
            if (currentIndex > 0) openReader(currentIndex - 1);
        }

        function goToNext(e) {
            e.preventDefault();
            if (currentIndex < READ_DATA.length - 1) openReader(currentIndex + 1);
        }

        closeBtn.addEventListener('click', closeReader);
        overlay.addEventListener('click', function(e) {
            if (e.target === this) closeReader();
        });
        readerPrev.addEventListener('click', goToPrev);
        readerNext.addEventListener('click', goToNext);

        document.addEventListener('keydown', function(e) {
            if (!overlay.classList.contains('active')) return;
            if (e.key === 'Escape') { closeReader(); return; }
            if (e.key === 'ArrowLeft') { if (currentIndex > 0) openReader(currentIndex - 1); }
            if (e.key === 'ArrowRight') { if (currentIndex < READ_DATA.length - 1) openReader(currentIndex + 1); }
        });

        document.addEventListener('languageChanged', function() {
            renderList();
            renderSceneButtons();
            const activeScene = SCENES.find(s => s.id === currentSceneId);
            if (activeScene) updateMusicInfo(activeScene);
        });

        function loadImmersiveData() {
            fetch('data/immersive.json')
                .then(res => {
                    if (!res.ok) throw new Error('immersive.json 不存在');
                    return res.json();
                })
                .then(data => {
                    READ_DATA = data.items || [];
                    renderList();
                })
                .catch(err => {
                    console.warn('加载沉浸式数据失败:', err);
                    READ_DATA = [];
                    renderList();
                });
        }

        // ================================================================
        //  🚀 启动
        // ================================================================
        document.addEventListener('DOMContentLoaded', function() {
            const toggle = document.querySelector('.nav-toggle');
            const links = document.querySelector('.nav-links');
            if (toggle && links) {
                toggle.addEventListener('click', function() {
                    links.classList.toggle('open');
                    toggle.textContent = links.classList.contains('open') ? '✕' : '☰';
                });
                links.querySelectorAll('a').forEach(function(link) {
                    link.addEventListener('click', function() {
                        links.classList.remove('open');
                        toggle.textContent = '☰';
                    });
                });
            }
            renderSceneButtons();
            loadImmersiveData();
        });
    </script>

</body>
</html>
