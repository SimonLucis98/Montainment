<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">游戏 · Montainment</title>
  <meta name="description" id="pageDesc" content="游戏页面" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .game-play-container { max-width: 1000px; margin: 0 auto; }
    .game-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 16px 0 8px;
    }
    .game-header .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #666; text-decoration: none; font-weight: 600; font-size: 15px; transition: 0.2s;
    }
    .game-header .back-link:hover { color: #1a1a2e; }
    .game-header .game-title { font-size: 22px; font-weight: 700; color: #1a1a2e; }

    .game-wrapper {
      background: #fff; border-radius: 24px; padding: 24px 28px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06); min-height: 500px; position: relative;
    }
    .game-wrapper .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }
    .game-wrapper .loading .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 4px solid #eef2f7; border-top-color: #2a6df4; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .game-wrapper .error { text-align: center; padding: 60px 20px; color: #d14c4c; }
    .game-wrapper .error h3 { font-size: 20px; margin-bottom: 8px; }

    /* ===== 🆕 更多游戏推荐区域 ===== */
    .game-recommendations {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(138, 155, 122, 0.12);
    }
    .game-recommendations .rec-title {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .game-recommendations .rec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }
    .game-recommendations .rec-card {
      background: #faf8f5;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      border: 1px solid rgba(138, 155, 122, 0.08);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
    }
    .game-recommendations .rec-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(61, 58, 53, 0.08);
      border-color: rgba(138, 155, 122, 0.2);
    }
    .game-recommendations .rec-card .rec-cover {
      width: 100%;
      aspect-ratio: 16/9;
      background: linear-gradient(145deg, #3d3a35, #5a4f45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: rgba(255,255,255,0.3);
      overflow: hidden;
    }
    .game-recommendations .rec-card .rec-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;  /* ← 🆕 关键：强制裁剪填充，统一大小 */
    }
    .game-recommendations .rec-card .rec-cover .rec-emoji {
      font-size: 52px;
      opacity: 0.5;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(145deg, #3d3a35, #5a4f45);
    }
    .game-recommendations .rec-card .rec-info {
      padding: 12px 14px 14px;
      flex: 1;
    }
    .game-recommendations .rec-card .rec-info .rec-title-text {
      font-size: 15px;
      font-weight: 700;
      color: #1a1a2e;
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .game-recommendations .rec-card .rec-info .rec-desc {
      font-size: 13px;
      color: rgba(61, 58, 53, 0.5);
      display: -webkit-box;
      -webkit-line-clamp: 1;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-top: 2px;
    }
    .game-recommendations .rec-empty {
      color: rgba(61, 58, 53, 0.3);
      text-align: center;
      padding: 20px 0;
      grid-column: 1 / -1;
    }

    /* ===== 手机端适配 ===== */
    @media (max-width: 720px) {
      .game-play-container { padding: 0 16px; }
    }
    @media (max-width: 600px) {
      .game-wrapper { padding: 16px; min-height: 300px; }
      .game-header .game-title { font-size: 18px; }
      .game-recommendations .rec-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .game-recommendations .rec-card .rec-info .rec-title-text { font-size: 14px; }
      .game-recommendations .rec-card .rec-info .rec-desc { font-size: 12px; }
    }
    @media (max-width: 420px) {
      .game-recommendations .rec-grid {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">
        <span class="brand-mark">✦</span>
        Montainment · 蒙堂木下
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">首页</a></li>
        <li><a href="quiz.html" data-i18n="nav.quiz">语言测验</a></li>
        <li><a href="game.html" class="active" data-i18n="nav.game">游戏</a></li>
        <li><a href="story.html" data-i18n="nav.story">故事工坊</a></li>
        <li><a href="immersive.html" data-i18n="nav.immersive">🌙 沉浸式工坊</a></li>
      </ul>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
    </nav>
  </header>

  <main>
    <div class="container game-play-container">
      <div class="game-header">
        <a href="game.html" class="back-link" data-i18n="gameplay.back">← 返回游戏大厅</a>
        <span class="game-title" id="gameTitleDisplay">🎮 加载中...</span>
      </div>

      <div class="game-wrapper" id="gameWrapper">
        <div class="loading">
          <div class="spinner"></div>
          <div data-i18n="gameplay.loading">⏳ 加载游戏中...</div>
        </div>
      </div>

      <!-- ===== 🆕 更多游戏推荐区域 ===== -->
      <div class="game-recommendations" id="gameRecommendations" style="display:none;">
        <div class="rec-title"><span data-i18n="gameplay.more_games">更多游戏</span></div>
        <div class="rec-grid" id="recGrid"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" data-i18n="common.footer">© 2026 Montainment · 蒙堂木下 · 一个让学习更好玩的静态网站</div>
  </footer>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    (function() {
      const wrapper = document.getElementById('gameWrapper');
      const titleDisplay = document.getElementById('gameTitleDisplay');
      const pageTitle = document.getElementById('pageTitle');
      const pageDesc = document.getElementById('pageDesc');
      const recContainer = document.getElementById('gameRecommendations');
      const recGrid = document.getElementById('recGrid');

      const params = new URLSearchParams(window.location.search);
      const gameId = params.get('game');

      // ===== 保存所有游戏数据供推荐使用 =====
      let allGames = [];
      let currentGameData = null;

      function getLang() {
        return window.i18n ? i18n.currentLang : 'en';
      }

      // ===== 🆕 渲染推荐游戏 =====
      function renderRecommendations(currentGameId) {
        // 过滤掉当前游戏和禁用的游戏
        const others = allGames
          .filter(g => g.id !== currentGameId && g.enabled !== false)
          .slice(0, 4);

        if (others.length === 0) {
          recContainer.style.display = 'none';
          return;
        }

        recContainer.style.display = 'block';
        const lang = getLang();
        let html = '';
        others.forEach(g => {
          const title = lang === 'zh' ? g.titleZh : g.titleEn;
          const desc = lang === 'zh' ? g.descriptionZh : g.descriptionEn;
          const icon = g.icon || '🎮';
          const coverHtml = g.cover && g.cover.trim() !== ''
            ? `<img src="${g.cover}" alt="${title}" />`
            : `<span class="rec-emoji">${icon}</span>`;

          html += `
            <a href="game-play.html?game=${g.id}" class="rec-card">
              <div class="rec-cover">${coverHtml}</div>
              <div class="rec-info">
                <div class="rec-title-text">${icon} ${title}</div>
                ${desc ? `<div class="rec-desc">${desc}</div>` : ''}
              </div>
            </a>
          `;
        });
        recGrid.innerHTML = html;

        // 应用 i18n 到推荐区域（如果有需要）
        applyI18n();
      }

      // ===== 语言切换时更新标题 + 推荐 =====
      document.addEventListener('languageChanged', function() {
        if (currentGameData) {
          const lang = getLang();
          const game = currentGameData;
          const displayTitle = (lang === 'zh' ? game.titleZh : game.titleEn) || game.titleZh;
          const desc = (lang === 'zh' ? game.descriptionZh : game.descriptionEn) || game.descriptionZh || '';
          titleDisplay.textContent = (game.icon || '🎮') + ' ' + displayTitle;
          document.title = displayTitle + ' · Montainment';
          pageDesc.content = desc;
          // 重新渲染推荐（更新语言）
          if (allGames.length > 0 && currentGameData) {
            renderRecommendations(currentGameData.id);
          }
        }
      });

      if (!gameId) {
        wrapper.innerHTML = `
          <div class="error">
            <div style="font-size:48px;">⚠️</div>
            <h3 data-i18n="gameplay.error_title">缺少游戏参数</h3>
            <p data-i18n="gameplay.error_desc">请从游戏大厅选择游戏进入。</p>
            <a href="game.html" style="display:inline-block;margin-top:16px;padding:10px 28px;background:#0b1c33;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;" data-i18n="gameplay.error_back">返回游戏大厅</a>
          </div>
        `;
        titleDisplay.textContent = '❌ 参数错误';
        applyI18n();
        return;
      }

      fetch('data/games.json')
        .then(res => {
          if (!res.ok) throw new Error('games.json 不存在');
          return res.json();
        })
        .then(data => {
          const games = data.games || [];
          allGames = games;
          const game = games.find(g => g.id === gameId);

          if (!game) {
            throw new Error('找不到游戏: ' + gameId);
          }

          if (game.enabled === false) {
            throw new Error('该游戏已下架');
          }

          currentGameData = game;

          // ===== 多语言标题 =====
          const lang = getLang();
          const displayTitle = (lang === 'zh' ? game.titleZh : game.titleEn) || game.titleZh;
          const desc = (lang === 'zh' ? game.descriptionZh : game.descriptionEn) || game.descriptionZh || '';

          titleDisplay.textContent = (game.icon || '🎮') + ' ' + displayTitle;
          document.title = displayTitle + ' · Montainment';
          pageDesc.content = desc;

          loadGame(game);
        })
        .catch(err => {
          console.error('加载游戏失败:', err);
          wrapper.innerHTML = `
            <div class="error">
              <div style="font-size:48px;">⚠️</div>
              <h3 data-i18n="gameplay.loading_failed">加载失败</h3>
              <p>${err.message}</p>
              <a href="game.html" style="display:inline-block;margin-top:16px;padding:10px 28px;background:#0b1c33;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;" data-i18n="gameplay.error_back">返回游戏大厅</a>
            </div>
          `;
          titleDisplay.textContent = '❌ 加载失败';
          applyI18n();
        });

      function loadGame(game) {
        // 对于 external 类型，直接跳转，不渲染推荐
        if (game.type === 'external' || game.type === 'redirect') {
          window.location.href = game.entry;
          return;
        }

        if (game.type === 'js') {
          // 原生 JS 游戏
          const script = document.createElement('script');
          script.src = game.entry + '?v=' + Date.now();
          script.onload = function() {
            wrapper.innerHTML = '';
            if (typeof window.initGame === 'function') {
              window.initGame(wrapper);
              // 🆕 游戏加载完成后渲染推荐
              renderRecommendations(game.id);
            } else {
              wrapper.innerHTML = `
                <div class="error">
                  <div style="font-size:48px;">⚠️</div>
                  <h3 data-i18n="gameplay.script_error">游戏加载失败</h3>
                  <p data-i18n="gameplay.script_error">游戏脚本未正确暴露 initGame 函数</p>
                </div>
              `;
              applyI18n();
            }
          };
          script.onerror = function() {
            wrapper.innerHTML = `
              <div class="error">
                <div style="font-size:48px;">⚠️</div>
                <h3 data-i18n="gameplay.script_load_error">脚本加载失败</h3>
                <p>${game.entry}</p>
                <a href="game.html" style="display:inline-block;margin-top:16px;padding:10px 28px;background:#0b1c33;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;" data-i18n="gameplay.error_back">返回游戏大厅</a>
              </div>
            `;
            applyI18n();
          };
          document.head.appendChild(script);

        } else if (game.type === 'iframe') {
          // iframe 嵌入
          wrapper.innerHTML = `
            <iframe src="${game.entry}" style="width:100%;min-height:600px;border:none;border-radius:16px;" allowfullscreen></iframe>
          `;
          // 🆕 iframe 加载完成后渲染推荐（给 iframe 一点加载时间）
          setTimeout(() => {
            renderRecommendations(game.id);
          }, 300);

        } else {
          wrapper.innerHTML = `
            <div class="error">
              <div style="font-size:48px;">⚠️</div>
              <h3 data-i18n="gameplay.unsupported">不支持的遊戲類型</h3>
              <p>類型: ${game.type}</p>
            </div>
          `;
          applyI18n();
        }
      }

    })();
  </script>

</body>
</html>
