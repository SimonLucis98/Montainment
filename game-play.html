<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="pageTitle">游戏 · Montainment</title>
  <meta name="description" id="pageDesc" content="游戏页面" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .game-play-container { max-width: 820px; margin: 0 auto; }
    .game-header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px; padding: 16px 0 8px;
    }
    .game-header .back-link {
      display: inline-flex; align-items: center; gap: 6px;
      color: #666; text-decoration: none; font-weight: 600; font-size: 15px; transition: 0.2s;
    }
    .game-header .back-link:hover { color: #1a1a2e; }
    .game-header .game-title { font-size: 22px; font-weight: 700; color: #1a1a2e; }

    .game-wrapper {
      background: #fff; border-radius: 24px; padding: 24px 28px 32px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.06); min-height: 500px; position: relative;
    }
    .game-wrapper .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 16px; }
    .game-wrapper .loading .spinner {
      display: inline-block; width: 40px; height: 40px;
      border: 4px solid #eef2f7; border-top-color: #2a6df4; border-radius: 50%;
      animation: spin 0.8s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .game-wrapper .error { text-align: center; padding: 60px 20px; color: #d14c4c; }
    .game-wrapper .error h3 { font-size: 20px; margin-bottom: 8px; }
    @media (max-width:600px) {
      .game-wrapper { padding: 16px; }
      .game-header .game-title { font-size: 18px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand"><span class="brand-mark">✦</span> Montainment</a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">首页</a></li>
        <li><a href="quiz.html" data-i18n="nav.quiz">语言测验</a></li>
        <li><a href="game.html" class="active" data-i18n="nav.game">游戏</a></li>
        <li><a href="story.html" data-i18n="nav.story">故事工坊</a></li>
      </ul>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
    </nav>
  </header>

  <main>
    <div class="container game-play-container">
      <div class="game-header">
        <a href="game.html" class="back-link" data-i18n="gameplay.back">← 返回游戏大厅</a>
        <span class="game-title" id="gameTitleDisplay">🎮 加载中...</span>
      </div>

      <div class="game-wrapper" id="gameWrapper">
        <div class="loading">
          <div class="spinner"></div>
          <div data-i18n="gameplay.loading">⏳ 加载游戏中...</div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" data-i18n="common.footer">© 2026 Montainment · 一个让学习更好玩的静态网站</div>
  </footer>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    (function() {
      const wrapper = document.getElementById('gameWrapper');
      const titleDisplay = document.getElementById('gameTitleDisplay');
      const pageTitle = document.getElementById('pageTitle');

      const params = new URLSearchParams(window.location.search);
      const gameId = params.get('game');

      if (!gameId) {
        wrapper.innerHTML = `
          <div class="error">
            <div style="font-size:48px;">⚠️</div>
            <h3 data-i18n="gameplay.error_title">缺少游戏参数</h3>
            <p data-i18n="gameplay.error_desc">请从游戏大厅选择游戏进入。</p>
            <a href="game.html" style="display:inline-block;margin-top:16px;padding:10px 28px;background:#0b1c33;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;" data-i18n="gameplay.error_back">返回游戏大厅</a>
          </div>
        `;
        titleDisplay.textContent = '❌ 参数错误';
        applyI18n();
        return;
      }

      fetch('data/games.json')
        .then(res => {
          if (!res.ok) throw new Error('games.json 不存在');
          return res.json();
        })
        .then(data => {
          const games = data.games || [];
          const game = games.find(g => g.id === gameId);

          if (!game) {
            throw new Error('找不到游戏: ' + gameId);
          }

          if (game.enabled === false) {
            throw new Error('该游戏已下架');
          }

          titleDisplay.textContent = game.icon + ' ' + game.titleZh;
          document.title = game.titleZh + ' · Montainment';
          document.getElementById('pageDesc').content = game.descriptionZh || '';

          loadGame(game);
        })
        .catch(err => {
          console.error('加载游戏失败:', err);
          wrapper.innerHTML = `
            <div class="error">
              <div style="font-size:48px;">⚠️</div>
              <h3 data-i18n="gameplay.loading_failed">加载失败</h3>
              <p>${err.message}</p>
              <a href="game.html" style="display:inline-block;margin-top:16px;padding:10px 28px;background:#0b1c33;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;" data-i18n="gameplay.error_back">返回游戏大厅</a>
            </div>
          `;
          titleDisplay.textContent = '❌ 加载失败';
          applyI18n();
        });

      function loadGame(game) {
        if (game.type === 'js') {
          const script = document.createElement('script');
          script.src = game.entry + '?v=' + Date.now();
          script.onload = function() {
            wrapper.innerHTML = '';
            if (typeof window.initGame === 'function') {
              window.initGame(wrapper);
            } else {
              wrapper.innerHTML = `
                <div class="error">
                  <div style="font-size:48px;">⚠️</div>
                  <h3 data-i18n="gameplay.script_error">游戏加载失败</h3>
                  <p data-i18n="gameplay.script_error">游戏脚本未正确暴露 initGame 函数</p>
                </div>
              `;
              applyI18n();
            }
          };
          script.onerror = function() {
            wrapper.innerHTML = `
              <div class="error">
                <div style="font-size:48px;">⚠️</div>
                <h3 data-i18n="gameplay.script_load_error">脚本加载失败</h3>
                <p>${game.entry}</p>
                <a href="game.html" style="display:inline-block;margin-top:16px;padding:10px 28px;background:#0b1c33;color:#fff;border-radius:30px;text-decoration:none;font-weight:600;" data-i18n="gameplay.error_back">返回游戏大厅</a>
              </div>
            `;
            applyI18n();
          };
          document.head.appendChild(script);

        } else if (game.type === 'iframe') {
          wrapper.innerHTML = `
            <iframe src="${game.entry}" style="width:100%;min-height:600px;border:none;border-radius:16px;"></iframe>
          `;

        } else {
          wrapper.innerHTML = `
            <div class="error">
              <div style="font-size:48px;">⚠️</div>
              <h3 data-i18n="gameplay.unsupported">不支持的遊戲類型</h3>
              <p>類型: ${game.type}</p>
            </div>
          `;
          applyI18n();
        }
      }

    })();
  </script>

</body>
</html>
