<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事工坊 - Montainment</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* ========== 全局 & 导航（同原版） ========== */
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#f5f2ed; font-family:'Nunito', system-ui, sans-serif; min-height:100vh; }
        header { background:#1a1a2e; padding:0 24px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
        nav { max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; height:64px; }
        .logo { color:#fff; font-size:22px; font-weight:700; letter-spacing:-0.5px; }
        .logo span { color:#f7c948; }
        nav ul { display:flex; gap:8px; list-style:none; }
        nav ul li a { color:rgba(255,255,255,0.7); text-decoration:none; padding:8px 18px; border-radius:8px; font-size:15px; font-weight:600; transition:0.2s; }
        nav ul li a:hover { color:#fff; background:rgba(255,255,255,0.08); }
        nav ul li a.active { color:#fff; background:#f7c948; color:#1a1a2e; }

        .story-container { max-width:900px; margin:0 auto; padding:24px 20px 40px; min-height:70vh; }

        /* 网格列表 */
        .story-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:24px; margin-top:8px; }
        .story-card {
            background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.06);
            cursor:pointer; transition:transform 0.25s ease, box-shadow 0.25s ease; display:flex; flex-direction:column;
            text-decoration:none; color:inherit;
        }
        .story-card:hover { transform:translateY(-6px); box-shadow:0 12px 40px rgba(0,0,0,0.10); }

        .story-cover {
            width:100%; aspect-ratio:16/10; background:linear-gradient(145deg,#2d2d44,#1a1a2e);
            display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden;
        }
        .story-cover img { width:100%; height:100%; object-fit:cover; }
        .story-cover .cover-emoji { font-size:52px; opacity:0.6; filter:grayscale(0.2); }
        .story-cover .cover-title { position:absolute; bottom:12px; right:16px; font-size:13px; color:rgba(255,255,255,0.3); font-weight:400; letter-spacing:2px; }

        .story-card-body { padding:16px 18px 18px; flex:1; display:flex; flex-direction:column; }
        .story-card-body .title { font-size:17px; font-weight:700; color:#1a1a2e; line-height:1.3; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
        .story-card-body .author { font-size:14px; color:#888; margin-bottom:8px; }
        .story-card-body .desc { font-size:14px; color:#666; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex:1; margin-bottom:12px; }
        .story-card-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f0ede8; padding-top:12px; margin-top:auto; }
        .story-card-footer .likes { font-size:14px; color:#999; display:flex; align-items:center; gap:4px; }
        .story-card-footer .likes .heart { color:#e74c5e; font-size:16px; }
        .story-card-footer .chapters-count { font-size:13px; color:#aaa; background:#f5f2ed; padding:2px 14px; border-radius:20px; }
        .story-card-footer .updated-time { font-size:12px; color:#bbb; }

        .empty-state { text-align:center; padding:60px 20px; color:#aaa; }
        .empty-state .icon { font-size:56px; margin-bottom:12px; }
        .empty-state h3 { font-size:20px; color:#666; margin-bottom:4px; }

        @media (max-width:600px) {
            .story-container { padding:16px 12px 32px; }
            .story-grid { grid-template-columns:1fr 1fr; gap:14px; }
            .story-card-body .title { font-size:15px; }
            .story-card-body .desc { font-size:13px; -webkit-line-clamp:1; }
            nav ul li a { font-size:13px; padding:6px 12px; }
            nav { height:56px; }
            .logo { font-size:18px; }
        }
        @media (max-width:420px) {
            .story-grid { grid-template-columns:1fr 1fr; gap:10px; }
            .story-card-body { padding:12px; }
            .story-card-body .title { font-size:13px; }
            .story-card-body .author { font-size:12px; }
            .story-card-body .desc { font-size:12px; -webkit-line-clamp:1; }
            .story-card-footer .likes { font-size:12px; }
            .story-card-footer .chapters-count { font-size:11px; padding:1px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Montainment</div>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="quiz.html">语言测验</a></li>
                <li><a href="game.html">游戏</a></li>
                <li><a href="story.html" class="active">故事工坊</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="story-container" id="app">
            <div style="margin-bottom:20px;">
                <h1 style="font-size:28px; font-weight:800; color:#1a1a2e;">📚 故事工坊</h1>
                <p style="color:#888; font-size:15px;">选择一部小说，开始阅读</p>
            </div>
            <div class="story-grid" id="storyGrid"></div>
        </div>
    </main>

    <script>
        // ================================================================
        //  小说列表页（跳转模式）
        //  从 data/stories.json 加载，显示卡片，点击跳转到 story-read.html?story=id
        //  点赞数从 localStorage 读取（优先于服务器数据）
        // ================================================================

        const storyGrid = document.getElementById('storyGrid');

        // ---------- localStorage 工具 ----------
        function getLikes(storyId) {
            const key = 'story_likes_' + storyId;
            const val = localStorage.getItem(key);
            return val !== null ? parseInt(val, 10) : null;
        }

        function setLikes(storyId, count) {
            localStorage.setItem('story_likes_' + storyId, String(count));
        }

        // ---------- 获取首字母 Emoji ----------
        function getCoverEmoji(title) {
            const map = {
                '灰':'🏚️','星':'⭐','魔':'🔮','时':'⏳','风':'🌪️','火':'🔥','水':'💧','暗':'🌙','光':'☀️','梦':'🌌',
                '剑':'⚔️','龙':'🐉','凤':'🦅','雪':'❄️','月':'🌙','海':'🌊','山':'⛰️','森':'🌲','林':'🌳','城':'🏰',
                '塔':'🗼','桥':'🌉','夜':'🌃','晨':'🌅','宇':'🌌','宙':'🌠','未':'🔮','来':'🚀','古':'🏛️','老':'🕰️',
                '新':'✨','世':'🌍','界':'🌎','王':'👑','骑':'🐴','勇':'🛡️','士':'⚔️','法':'📜','师':'🧙','猎':'🏹',
                '人':'🧑','神':'⚡','妖':'🌸','怪':'👾','灵':'👻','魂':'💫','血':'🩸','骨':'💀','瞳':'👁️','翼':'🦇',
                '心':'❤️','意':'🧠','念':'💭','情':'💝','爱':'💖','生':'🌱','死':'🕊️','命':'🌀','运':'🎲','真':'💎',
                '美':'🌸','善':'😇','恶':'👿','明':'🌞','白':'⬜','黑':'⬛','红':'🔴','蓝':'🔵','绿':'🟢','黄':'🟡',
                '金':'🪙','银':'🥈','宝':'💎','钱':'💰','财':'🏦'
            };
            return map[title.charAt(0)] || '📖';
        }

        function getCoverColor(title) {
            const colors = [
                'linear-gradient(145deg,#2d2d44,#1a1a2e)',
                'linear-gradient(145deg,#3d2d44,#2a1a2e)',
                'linear-gradient(145deg,#2d3d44,#1a2a2e)',
                'linear-gradient(145deg,#443d2d,#2e2a1a)',
                'linear-gradient(145deg,#442d3d,#2e1a2a)',
                'linear-gradient(145deg,#2d443d,#1a2e2a)',
                'linear-gradient(145deg,#3d2d44,#2a1a3e)',
                'linear-gradient(145deg,#3d442d,#2a2e1a)',
            ];
            let hash = 0;
            for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function formatTime(iso) {
            if (!iso) return '未知';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
        }

        // ---------- 渲染列表 ----------
        function renderList(stories) {
            if (!stories || stories.length === 0) {
                storyGrid.innerHTML = `<div style="grid-column:1/-1;"><div class="empty-state"><div class="icon">📚</div><h3>暂无小说</h3><p>请在后台添加小说内容 🚧</p></div></div>`;
                return;
            }

            let html = '';
            stories.forEach((story, idx) => {
                // 从 localStorage 获取点赞数，若没有则用服务器数据
                let likes = getLikes(story.id);
                if (likes === null) {
                    likes = story.likes || 0;
                    setLikes(story.id, likes); // 初始化
                }

                const coverEmoji = getCoverEmoji(story.title);
                const coverColor = getCoverColor(story.title);
                const desc = story.description || '📝 暂无简介';
                const chCount = story.chapters ? story.chapters.length : 0;
                const updated = formatTime(story.updatedAt);
                const hasCover = story.cover && story.cover.trim() !== '';
                const coverHtml = hasCover ? `<img src="${story.cover}" alt="${story.title}" />` : `<span class="cover-emoji">${coverEmoji}</span>`;

                html += `
                    <a href="story-read.html?story=${story.id}" class="story-card">
                        <div class="story-cover" style="background:${hasCover ? '#1a1a2e' : coverColor};">
                            ${coverHtml}
                            <span class="cover-title">${story.title.substring(0,4)}</span>
                        </div>
                        <div class="story-card-body">
                            <div class="title">${story.title}</div>
                            <div class="author">作者：${story.author || '未知作者'}</div>
                            <div class="desc">${desc}</div>
                            <div class="story-card-footer">
                                <span class="likes"><span class="heart">❤️</span> ${likes}</span>
                                <span class="chapters-count">${chCount} 章</span>
                                <span class="updated-time">🕒 ${updated}</span>
                            </div>
                        </div>
                    </a>
                `;
            });

            storyGrid.innerHTML = html;
        }

        // ---------- 加载数据 ----------
        function loadStories() {
            fetch('data/stories.json')
                .then(res => {
                    if (!res.ok) throw new Error('stories.json 不存在');
                    return res.json();
                })
                .then(data => {
                    const stories = data.stories || [];
                    // 初始化 localStorage 中不存在点赞数的条目（确保所有小说都有本地记录）
                    stories.forEach(s => {
                        if (getLikes(s.id) === null) {
                            setLikes(s.id, s.likes || 0);
                        }
                    });
                    renderList(stories);
                })
                .catch(err => {
                    console.warn('加载小说数据失败:', err);
                    renderList([]);
                });
        }

        loadStories();
    </script>

</body>
</html>
