<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事工坊 - Montainment</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#f5f2ed; font-family:'Nunito', system-ui, sans-serif; min-height:100vh; }

        .story-container { max-width: 1400px; margin:0 auto; padding:24px 24px 40px; min-height:70vh; }

        /* ===== 古风音乐播放器 ===== */
        .music-player {
            background: linear-gradient(135deg, #2d2a24, #4a3f35);
            border-radius: 40px;
            padding: 8px 16px 8px 20px;
            display: inline-flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            border: 1px solid rgba(201, 168, 124, 0.15);
            margin-bottom: 20px;
            backdrop-filter: blur(4px);
            flex-wrap: wrap;
        }
        .music-player .icon { font-size: 18px; opacity: 0.6; color: #c9a87c; }
        .music-player .info { display: flex; flex-direction: column; gap: 0px; }
        .music-player .info .title { font-size: 13px; font-weight: 600; color: #e8e0d8; letter-spacing: 0.5px; white-space: nowrap; }
        .music-player .info .sub { font-size: 11px; color: rgba(232,224,216,0.4); letter-spacing: 0.3px; }
        .music-player .controls { display: flex; align-items: center; gap: 6px; }
        .music-player .controls button {
            width: 32px; height: 32px; border-radius: 50%;
            border: 1px solid rgba(201, 168, 124, 0.2);
            background: rgba(255,255,255,0.04); color: #e8e0d8;
            font-size: 14px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-family: inherit;
        }
        .music-player .controls button:hover { background: rgba(201, 168, 124, 0.12); border-color: rgba(201, 168, 124, 0.3); }
        .music-player .controls button.playing { background: rgba(201, 168, 124, 0.15); border-color: #c9a87c; }
        .music-player .controls .volume-slider {
            width: 60px; height: 3px; -webkit-appearance: none;
            background: rgba(255,255,255,0.1); border-radius: 2px; outline: none; cursor: pointer;
        }
        .music-player .controls .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px; border-radius: 50%;
            background: #c9a87c; cursor: pointer;
        }
        .music-player .controls .volume-slider::-moz-range-thumb {
            width: 10px; height: 10px; border-radius: 50%; background: #c9a87c; cursor: pointer; border: none;
        }
        .music-player .badge {
            font-size: 10px; font-weight: 700; color: #c9a87c;
            background: rgba(201, 168, 124, 0.08); padding: 2px 10px;
            border-radius: 20px; border: 1px solid rgba(201, 168, 124, 0.06); letter-spacing: 0.5px;
        }

        /* ===== 语言过滤栏 ===== */
        .story-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .filter-btn {
            padding: 8px 22px;
            border-radius: 30px;
            border: 1px solid rgba(138, 155, 122, 0.25);
            background: #faf8f5;
            color: #5a544b;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filter-btn:hover {
            background: #f0ede8;
            border-color: rgba(138, 155, 122, 0.4);
            transform: translateY(-1px);
        }
        .filter-btn.active {
            background: linear-gradient(135deg, #8a9b7a, #7a8b6a);
            color: #fff;
            border-color: #7a8b6a;
            box-shadow: 0 4px 12px rgba(138, 155, 122, 0.3);
        }
        .filter-btn .count {
            font-size: 11px;
            background: rgba(0,0,0,0.08);
            padding: 1px 8px;
            border-radius: 10px;
            font-weight: 700;
        }
        .filter-btn.active .count {
            background: rgba(255,255,255,0.2);
        }

        /* ===== 小说网格 ===== */
        .story-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 24px;
            margin-top: 8px;
        }
        .story-card {
            background: #faf8f5;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(61, 58, 53, 0.06);
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
            position: relative;
            border-top: 4px solid;
            border-image: linear-gradient(90deg, #8a9b7a, #d4b87a, #c97a6b) 1;
        }
        .story-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(61, 58, 53, 0.08);
        }
        .story-cover {
            width: 100%;
            aspect-ratio: 16/10;
            background: linear-gradient(145deg, #3d3a35, #5a4f45);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .story-cover img { width:100%; height:100%; object-fit:cover; }
        .story-cover .cover-emoji { font-size:52px; opacity:0.6; filter:grayscale(0.2); }
        .story-cover .cover-title {
            position: absolute; bottom: 12px; right: 16px;
            font-size: 13px; color: rgba(255,255,255,0.3); font-weight: 400; letter-spacing: 2px;
        }
        /* 语言徽章 */
        .story-cover .lang-badge {
            position: absolute;
            top: 10px;
            right: 12px;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 10px;
            background: rgba(0,0,0,0.5);
            color: #fff;
            letter-spacing: 0.5px;
            backdrop-filter: blur(4px);
        }
        .story-cover .lang-badge.zh {
            background: rgba(201, 122, 107, 0.85);
        }
        .story-cover .lang-badge.en {
            background: rgba(42, 109, 244, 0.85);
        }

        .story-card-body { padding: 16px 18px 18px; flex:1; display:flex; flex-direction:column; }
        .story-card-body .title { font-size:17px; font-weight:700; color:#3d3a35; line-height:1.3; margin-bottom:2px; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden; }
        .story-card-body .author { font-size:14px; color:rgba(61,58,53,0.7); margin-bottom:8px; }
        .story-card-body .desc { font-size:14px; color:rgba(61,58,53,0.6); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex:1; margin-bottom:12px; }
        .story-card-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(138,155,122,0.12); padding-top:12px; margin-top:auto; flex-wrap:wrap; gap:6px; }
        .story-card-footer .likes { font-size:14px; color:rgba(61,58,53,0.7); display:flex; align-items:center; gap:4px; }
        .story-card-footer .likes .heart { color:#c97a6b; }
        .story-card-footer .chapters-count { font-size:13px; color:rgba(61,58,53,0.7); background:#f0ede8; padding:2px 14px; border-radius:20px; white-space:nowrap; }
        .story-card-footer .updated-time { font-size:12px; color:rgba(61,58,53,0.4); white-space:nowrap; }

        .empty-state { text-align:center; padding:60px 20px; color:#aaa; }
        .empty-state .icon { font-size:56px; margin-bottom:12px; }
        .empty-state h3 { font-size:20px; color:#666; margin-bottom:4px; }

        /* ===== 响应式 ===== */
        @media (max-width: 1480px) {
            .story-container { max-width: 1160px; padding: 24px 20px 40px; }
        }
        @media (max-width: 1200px) {
            .story-container { max-width: 900px; padding: 24px 20px 40px; }
        }
        @media (max-width: 860px) {
            .story-container { max-width: 600px; padding: 16px 16px 32px; }
        }
        @media (max-width: 720px) {
            .story-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
            .story-card-body .title { font-size:15px; }
            .story-card-body .desc { font-size:13px; -webkit-line-clamp:1; }
            .story-card-footer { flex-wrap:wrap; gap:4px; }
            .story-card-footer .chapters-count { font-size:12px; padding:2px 10px; }
            .story-card-footer .updated-time { font-size:11px; }
        }
        @media (max-width: 600px) {
            .story-container { max-width: 100%; padding: 16px 12px 32px; }
            .story-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .story-card-body { padding:12px; }
            .story-card-body .title { font-size:14px; }
            .story-card-body .author { font-size:12px; }
            .story-card-body .desc { font-size:12px; -webkit-line-clamp:1; }
            .story-card-footer .likes { font-size:12px; }
            .story-card-footer .chapters-count { font-size:11px; padding:1px 10px; }
            .story-card-footer .updated-time { font-size:10px; }
            .music-player {
                padding: 6px 12px 6px 16px;
                border-radius: 30px;
                width: 100%;
                justify-content: space-between;
            }
            .music-player .info .title { font-size: 12px; }
            .music-player .controls .volume-slider { width: 40px; }
            .music-player .badge { font-size: 9px; padding: 1px 8px; }
            .filter-btn { padding: 6px 16px; font-size: 13px; }
            .filter-btn .count { font-size: 10px; padding: 1px 6px; }
        }
        @media (max-width: 420px) {
            .story-grid { grid-template-columns:1fr 1fr; gap:10px; }
            .story-card-body .title { font-size:13px; }
            .story-card-footer .chapters-count { font-size:10px; padding:1px 8px; }
            .story-card-footer .updated-time { font-size:9px; }
            .music-player .info .sub { display: none; }
            .music-player .controls .volume-slider { width: 30px; }
            .filter-btn { padding: 5px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <!-- ===== 导航栏 ===== -->
    <header class="site-header">
        <nav class="nav-bar">
            <a href="index.html" class="brand">
                <span class="brand-mark">✦</span>
                Montainment · 蒙堂木下
            </a>
            <ul class="nav-links">
                <li><a href="index.html" data-i18n="nav.home">首页</a></li>

        <div class="page-header container">

        <div class="container" style="max-width:1400px; padding:0 24px;">
            <div class="story-container" id="app" style="max-width:100%; padding:0;">

                <!-- ===== 🎵 古风音乐播放器 ===== -->
                <div class="music-player" id="musicPlayer">

                    <div class="info">

    <footer class="site-footer">
        <div class="container" data-i18n="common.footer">© 2026 Montainment · 蒙堂木下 · 一个让学习更好玩的静态网站</div>
    </footer>

    <script src="i18n.js"></script>
    <script src="common.js"></script>
    <script>
        // ================================================================
        //  🎵 音乐播放器
        // ================================================================
        (function() {
            const YOUTUBE_VIDEO_ID = '9_KdMxi2dEc';
            let ytPlayer = null;
            let isPlaying = false;
            let autoPlayUsed = false;
            let userInteracted = false;
            const playBtn = document.getElementById('playBtn');
            const volumeSlider = document.getElementById('volumeSlider');

            const container = document.createElement('div');
            container.style.cssText = 'position:fixed;bottom:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
            container.innerHTML = '<div id="youtubePlayer"></div>';
            document.body.appendChild(container);

            window.onYouTubeIframeAPIReady = function() {
                ytPlayer = new YT.Player('youtubePlayer', {
                    height: '1',
                    width: '1',
                    videoId: YOUTUBE_VIDEO_ID,
                    playerVars: {
                        autoplay: 0,
                        controls: 0,
                        loop: 1,
                        playlist: YOUTUBE_VIDEO_ID,
                        modestbranding: 1,
                        rel: 0,
                        showinfo: 0,
                        playsinline: 1
                    }
                });
            };

            if (window.YT && window.YT.Player) {
                window.onYouTubeIframeAPIReady();
            }

            function updateButton(state) {
                isPlaying = state;
                if (state) {
                    playBtn.textContent = '⏸';
                    playBtn.classList.add('playing');
                } else {
                    playBtn.textContent = '▶';
                    playBtn.classList.remove('playing');
                }
            }

            function playMusic() {
                userInteracted = true;
                if (!ytPlayer || !ytPlayer.playVideo) return;
                try {
                    ytPlayer.playVideo();
                    if (ytPlayer.setVolume) ytPlayer.setVolume(parseInt(volumeSlider.value, 10));
                } catch (e) { console.warn(e); }
                updateButton(true);
            }

            function pauseMusic() {
                if (!ytPlayer || !ytPlayer.pauseVideo) return;
                try { ytPlayer.pauseVideo(); } catch (e) {}
                updateButton(false);
            }

            function toggleMusic() {
                if (isPlaying) pauseMusic(); else playMusic();
            }

            playBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMusic();
            });

            document.querySelector('.music-player').addEventListener('click', function(e) {
                if (e.target.closest('button') || e.target.closest('input')) return;
                toggleMusic();
            });

            document.addEventListener('click', function autoPlay(e) {
                if (autoPlayUsed || isPlaying) return;
                if (e.target.closest('#playBtn') || e.target.closest('.music-player')) return;
                if (e.target.closest('.immersive-entry')) return;
                playMusic();
                autoPlayUsed = true;
                document.removeEventListener('click', autoPlay);
            });

            volumeSlider.addEventListener('input', function() {
                if (ytPlayer && ytPlayer.setVolume) {
                    try { ytPlayer.setVolume(parseInt(this.value, 10)); } catch (e) {}
                }
            });

            updateButton(false);

            window.musicPlayer = {
                play: playMusic,
                pause: pauseMusic,
                toggle: toggleMusic,
                setVolume: function(val) { volumeSlider.value = val; }
            };
        })();

        // ================================================================
        //  🌐 语言自动检测
        // ================================================================
        /**
         * 通过字符判断文本语言
         * 中文字符占比 > 30% → 中文
         * 否则 → 英文
         */
        function detectLang(text) {
            if (!text || typeof text !== 'string') return 'unknown';
            // 移除空白和标点
            const clean = text.replace(/[\s\p{P}]/gu, '');
            if (clean.length === 0) return 'unknown';

            // 统计中文字符数（CJK 统一汉字 + 扩展区）
            const chineseMatches = clean.match(/[\u4e00-\u9fff\u3400-\u4dbf]/g);
            const chineseCount = chineseMatches ? chineseMatches.length : 0;

            // 中文字符占比
            const ratio = chineseCount / clean.length;
            return ratio > 0.3 ? 'zh' : 'en';
        }

        // ================================================================
        //  小说列表
        // ================================================================

        const storyGrid = document.getElementById('storyGrid');
        const filterContainer = document.getElementById('storyFilter');

        let allStories = [];
        let currentFilter = 'all'; // 'all' | 'zh' | 'en'

        function getLikes(storyId) {
            const key = 'story_likes_' + storyId;
            const val = localStorage.getItem(key);
            return val !== null ? parseInt(val, 10) : null;
        }

        function setLikes(storyId, count) {
            localStorage.setItem('story_likes_' + storyId, String(count));
        }

        function getCoverEmoji(title) {
            const map = {
                '灰':'🏚️','星':'⭐','魔':'🔮','时':'⏳','风':'🌪️','火':'🔥','水':'💧','暗':'🌙','光':'☀️','梦':'🌌',
                '剑':'⚔️','龙':'🐉','凤':'🦅','雪':'❄️','月':'🌙','海':'🌊','山':'⛰️','森':'🌲','林':'🌳','城':'🏰',
                '塔':'🗼','桥':'🌉','夜':'🌃','晨':'🌅','宇':'🌌','宙':'🌠','未':'🔮','来':'🚀','古':'🏛️','老':'🕰️',
                '新':'✨','世':'🌍','界':'🌎','王':'👑','骑':'🐴','勇':'🛡️','士':'⚔️','法':'📜','师':'🧙','猎':'🏹',
                '人':'🧑','神':'⚡','妖':'🌸','怪':'👾','灵':'👻','魂':'💫','血':'🩸','骨':'💀','瞳':'👁️','翼':'🦇',
                '心':'❤️','意':'🧠','念':'💭','情':'💝','爱':'💖','生':'🌱','死':'🕊️','命':'🌀','运':'🎲','真':'💎',
                '美':'🌸','善':'😇','恶':'👿','明':'🌞','白':'⬜','黑':'⬛','红':'🔴','蓝':'🔵','绿':'🟢','黄':'🟡',
                '金':'🪙','银':'🥈','宝':'💎','钱':'💰','财':'🏦'
            };
            return map[title.charAt(0)] || '📖';
        }

        function getCoverColor(title) {
            const colors = [
                'linear-gradient(145deg,#2d2d44,#1a1a2e)',
                'linear-gradient(145deg,#3d2d44,#2a1a2e)',
                'linear-gradient(145deg,#2d3d44,#1a2a2e)',
                'linear-gradient(145deg,#443d2d,#2e2a1a)',
                'linear-gradient(145deg,#442d3d,#2e1a2a)',
                'linear-gradient(145deg,#2d443d,#1a2e2a)',
                'linear-gradient(145deg,#3d2d44,#2a1a3e)',
                'linear-gradient(145deg,#3d442d,#2a2e1a)',
            ];
            let hash = 0;
            for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function formatTime(iso) {
            if (!iso) return i18n.t('story.unknown_time') || '未知';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
        }

        function updateFilterCounts() {
            const countAll = document.getElementById('countAll');
            const countZh = document.getElementById('countZh');
            const countEn = document.getElementById('countEn');
            if (countAll) countAll.textContent = allStories.length;
            if (countZh) countZh.textContent = allStories.filter(s => detectLang(s.title) === 'zh').length;
            if (countEn) countEn.textContent = allStories.filter(s => detectLang(s.title) === 'en').length;
        }

        function renderList() {
            let filtered = allStories;
            if (currentFilter === 'zh') {
                filtered = allStories.filter(s => detectLang(s.title) === 'zh');
            } else if (currentFilter === 'en') {
                filtered = allStories.filter(s => detectLang(s.title) === 'en');
            }

            if (!filtered || filtered.length === 0) {
                let emptyMsg = i18n.t('story.empty_title');
                if (currentFilter === 'zh') {
                    emptyMsg = i18n.currentLang === 'en' ? 'No Chinese novels' : '暂无中文小说';
                } else if (currentFilter === 'en') {
                    emptyMsg = i18n.currentLang === 'en' ? 'No English novels' : '暂无英文小说';
                }
                storyGrid.innerHTML = `
                    <div style="grid-column:1/-1;">
                        <div class="empty-state">
                            <div class="icon">📚</div>
                            <h3>${emptyMsg}</h3>
                            <p data-i18n="story.empty_desc">请在后台添加小说内容 🚧</p>
                        </div>
                    </div>
                `;
                applyI18n();
                return;
            }

            let html = '';
            filtered.forEach((story) => {
                let likes = getLikes(story.id);
                if (likes === null) {
                    likes = story.likes || 0;
                    setLikes(story.id, likes);
                }

                // 🆕 自动检测语言
                const lang = detectLang(story.title);
                const coverEmoji = getCoverEmoji(story.title);
                const coverColor = getCoverColor(story.title);
                const desc = story.description || ('📝 ' + (window.i18n ? i18n.t('story.no_desc') : '暂无简介'));
                const chCount = story.chapters ? story.chapters.length : 0;
                const updated = formatTime(story.updatedAt);
                const hasCover = story.cover && story.cover.trim() !== '';
                const coverHtml = hasCover ? `<img src="${story.cover}" alt="${story.title}" />` : `<span class="cover-emoji">${coverEmoji}</span>`;

                // 🆕 语言徽章
                const langLabel = lang === 'zh' ? 'CN' : (lang === 'en' ? 'EN' : '');
                const langBadge = langLabel ? `<span class="lang-badge ${lang}">${langLabel}</span>` : '';

                html += `
                    <a href="story-read.html?story=${story.id}" class="story-card">
                        <div class="story-cover" style="background:${hasCover ? '#1a1a2e' : coverColor};">
                            ${coverHtml}
                            ${langBadge}
                            <span class="cover-title">${story.title.substring(0,4)}</span>
                        </div>
                        <div class="story-card-body">
                            <div class="title">${story.title}</div>
                            <div class="author"><span data-i18n="story.author_prefix">作者：</span>${story.author || (window.i18n ? i18n.t('story.unknown_author') : '未知作者')}</div>
                            <div class="desc">${desc}</div>
                            <div class="story-card-footer">
                                <span class="likes"><span class="heart">❤️</span> ${likes}</span>
                                <span class="chapters-count">${chCount} <span data-i18n="story.chapters">章</span></span>
                                <span class="updated-time"><span data-i18n="story.updated">🕒</span> ${updated}</span>
                            </div>
                        </div>
                    </a>
                `;
            });

            storyGrid.innerHTML = html;
            applyI18n();
        }

        function setFilter(filter) {
            currentFilter = filter;
            filterContainer.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.filter === filter);
            });
            renderList();
        }

        filterContainer.addEventListener('click', function(e) {
            const btn = e.target.closest('.filter-btn');
            if (!btn) return;
            setFilter(btn.dataset.filter);
        });

        // 语言切换时仅重渲染（不影响过滤逻辑，过滤基于字符判断）
        document.addEventListener('languageChanged', function() {
            renderList();
            applyI18n();
        });

        function loadStories() {
            fetch('data/stories.json')
                .then(res => {
                    if (!res.ok) throw new Error('stories.json 不存在');
                    return res.json();
                })
                .then(data => {
                    allStories = data.stories || [];
                    allStories.forEach(s => {
                        if (getLikes(s.id) === null) {
                            setLikes(s.id, s.likes || 0);
                        }
                    });
                    updateFilterCounts();
                    renderList();
                })
                .catch(err => {
                    console.warn('加载小说数据失败:', err);
                    allStories = [];
                    updateFilterCounts();
                    renderList();
                });
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadStories);
        } else {
            loadStories();
        }
    </script>

</body>
</html>
