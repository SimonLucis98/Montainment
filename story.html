<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>故事工坊 - Montainment</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        /* 小说阅读专用样式（保持原样） */
        .story-container {
            max-width: 720px;
            margin: 0 auto;
            padding: 20px;
            background: #faf8f5;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            min-height: 70vh;
        }
        .story-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
            color: #1a1a2e;
        }
        .story-author {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .chapter-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        .chapter-nav button {
            padding: 8px 20px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: 0.2s;
            flex: 1;
            max-width: 140px;
        }
        .chapter-nav button:hover:not(:disabled) {
            background: #1a1a2e;
            color: white;
            border-color: #1a1a2e;
        }
        .chapter-nav button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .chapter-indicator {
            font-size: 14px;
            color: #555;
            text-align: center;
            flex: 1;
        }
        .chapter-selector {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 24px;
        }
        .chapter-selector button {
            padding: 6px 14px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .chapter-selector button.active {
            background: #1a1a2e;
            color: white;
            border-color: #1a1a2e;
        }
        .chapter-selector button:hover:not(.active) {
            background: #f0f0f0;
        }
        .chapter-content {
            font-size: 18px;
            line-height: 1.9;
            color: #2c2c2c;
            white-space: pre-wrap;
            word-break: break-word;
            padding: 4px 0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }
        .chapter-content p {
            margin-bottom: 1.2em;
            text-indent: 2em;
        }
        .ad-placeholder {
            background: #f0f0f0;
            text-align: center;
            padding: 16px;
            border-radius: 8px;
            color: #999;
            font-size: 13px;
            margin: 24px 0 12px;
        }
        /* 小说选择器（新增） */
        .story-selector {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 20px;
        }
        .story-selector button {
            padding: 10px 24px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: 0.2s;
            color: #1a1a2e;
        }
        .story-selector button.active {
            border-color: #1a1a2e;
            background: #1a1a2e;
            color: white;
        }
        .story-selector button:hover:not(.active) {
            background: #f5f5f5;
        }
        .loading-msg {
            text-align: center;
            color: #888;
            padding: 40px 0;
            font-size: 16px;
        }
        @media (max-width: 600px) {
            .story-container { padding: 16px; }
            .story-title { font-size: 22px; }
            .chapter-content { font-size: 16px; line-height: 1.8; }
            .chapter-nav button { font-size: 13px; padding: 6px 14px; }
            .story-selector button { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Montainment</div>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="quiz.html">语言测验</a></li>
                <li><a href="game.html">记忆游戏</a></li>
                <li><a href="story.html" class="active">故事工坊</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="story-container">
            <!-- 小说选择器 -->
            <div class="story-selector" id="storySelector"></div>

            <!-- 标题 / 作者 -->
            <h1 class="story-title" id="storyTitle">📖 选择一本小说</h1>
            <div class="story-author" id="storyAuthor">作者</div>

            <!-- 章节快捷跳转 -->
            <div class="chapter-selector" id="chapterSelector"></div>

            <!-- 上一章 / 下一章 -->
            <div class="chapter-nav">
                <button id="prevChapter">上一章</button>
                <span class="chapter-indicator" id="chapterIndicator">第 1 / 1 章</span>
                <button id="nextChapter">下一章</button>
            </div>

            <!-- 正文 -->
            <div class="chapter-content" id="chapterContent"></div>

            <!-- 广告位 -->
            <div class="ad-placeholder">📢 广告位</div>
        </div>
    </main>

    <script>
        // ================================================================
        //  story.html — 从 data/stories.json 加载小说数据
        // ================================================================

        let allStories = [];
        let currentStoryIndex = 0;
        let currentChapterIndex = 0;

        const storyTitle = document.getElementById('storyTitle');
        const storyAuthor = document.getElementById('storyAuthor');
        const chapterSelector = document.getElementById('chapterSelector');
        const chapterContent = document.getElementById('chapterContent');
        const chapterIndicator = document.getElementById('chapterIndicator');
        const prevBtn = document.getElementById('prevChapter');
        const nextBtn = document.getElementById('nextChapter');
        const storySelector = document.getElementById('storySelector');

        function renderStorySelector() {
            if (allStories.length === 0) {
                storySelector.innerHTML = '<p style="color:#888;width:100%;text-align:center;">暂无小说，请等待添加 🚧</p>';
                return;
            }
            let html = '';
            allStories.forEach((s, i) => {
                html += `<button class="${i === currentStoryIndex ? 'active' : ''}" data-index="${i}">${s.title}</button>`;
            });
            storySelector.innerHTML = html;

            storySelector.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.index);
                    if (idx === currentStoryIndex) return;
                    currentStoryIndex = idx;
                    currentChapterIndex = 0;
                    renderStorySelector();
                    renderChapter(currentStoryIndex, currentChapterIndex);
                });
            });
        }

        function renderChapter(storyIdx, chapterIdx) {
            const story = allStories[storyIdx];
            if (!story) {
                storyTitle.textContent = '📖 未找到小说';
                storyAuthor.textContent = '';
                chapterContent.textContent = '';
                chapterIndicator.textContent = '';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                chapterSelector.innerHTML = '';
                return;
            }

            const chapters = story.chapters || [];
            if (chapters.length === 0) {
                storyTitle.textContent = story.title || '无标题';
                storyAuthor.textContent = story.author || '未知作者';
                chapterContent.textContent = '📝 此小说暂无章节';
                chapterIndicator.textContent = '0 / 0 章';
                prevBtn.disabled = true;
                nextBtn.disabled = true;
                chapterSelector.innerHTML = '';
                return;
            }

            // 确保索引有效
            if (chapterIdx >= chapters.length) chapterIdx = chapters.length - 1;
            if (chapterIdx < 0) chapterIdx = 0;
            currentChapterIndex = chapterIdx;

            const ch = chapters[chapterIdx];
            storyTitle.textContent = story.title || '无标题';
            storyAuthor.textContent = story.author || '未知作者';
            chapterContent.textContent = ch.content || '(内容为空)';
            chapterIndicator.textContent = `第 ${chapterIdx + 1} / ${chapters.length} 章`;

            prevBtn.disabled = (chapterIdx === 0);
            nextBtn.disabled = (chapterIdx === chapters.length - 1);

            // 渲染章节选择器
            let selHtml = '';
            chapters.forEach((c, i) => {
                selHtml += `<button class="${i === chapterIdx ? 'active' : ''}" data-chapter="${i}">${c.title || '第' + (i+1) + '章'}</button>`;
            });
            chapterSelector.innerHTML = selHtml;
            chapterSelector.querySelectorAll('button').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.chapter);
                    renderChapter(currentStoryIndex, idx);
                });
            });

            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 上一章 / 下一章
        prevBtn.addEventListener('click', function() {
            if (currentChapterIndex > 0) {
                renderChapter(currentStoryIndex, currentChapterIndex - 1);
            }
        });

        nextBtn.addEventListener('click', function() {
            const story = allStories[currentStoryIndex];
            if (story && story.chapters && currentChapterIndex < story.chapters.length - 1) {
                renderChapter(currentStoryIndex, currentChapterIndex + 1);
            }
        });

        // ================================================================
        //  加载数据
        // ================================================================
        function loadStories() {
            fetch('data/stories.json')
                .then(res => {
                    if (!res.ok) throw new Error('stories.json 不存在');
                    return res.json();
                })
                .then(data => {
                    if (data.stories && data.stories.length > 0) {
                        allStories = data.stories;
                    } else {
                        allStories = [];
                    }
                    renderStorySelector();
                    if (allStories.length > 0) {
                        renderChapter(0, 0);
                    } else {
                        storyTitle.textContent = '📖 暂无小说';
                        storyAuthor.textContent = '';
                        chapterContent.textContent = '请在后台添加小说内容 🚧';
                        chapterIndicator.textContent = '';
                        prevBtn.disabled = true;
                        nextBtn.disabled = true;
                        chapterSelector.innerHTML = '';
                    }
                })
                .catch(err => {
                    console.warn('加载小说数据失败:', err);
                    allStories = [];
                    renderStorySelector();
                    storyTitle.textContent = '📖 暂无小说';
                    storyAuthor.textContent = '';
                    chapterContent.textContent = '请在后台添加小说内容 🚧';
                    chapterIndicator.textContent = '';
                    prevBtn.disabled = true;
                    nextBtn.disabled = true;
                    chapterSelector.innerHTML = '';
                });
        }

        // 启动
        loadStories();
    </script>

</body>
</html>
