<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>阅读 · Montainment</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#f5f2ed; font-family:'Nunito', system-ui, sans-serif; min-height:100vh; }

        header { background:#1a1a2e; padding:0 24px; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(0,0,0,0.15); }
        nav { max-width:1100px; margin:0 auto; display:flex; justify-content:space-between; align-items:center; height:64px; }
        .logo { color:#fff; font-size:22px; font-weight:700; }
        .logo span { color:#f7c948; }
        nav ul { display:flex; gap:8px; list-style:none; }
        nav ul li a { color:rgba(255,255,255,0.7); text-decoration:none; padding:8px 18px; border-radius:8px; font-size:15px; font-weight:600; transition:0.2s; }
        nav ul li a:hover { color:#fff; background:rgba(255,255,255,0.08); }
        nav ul li a.active { color:#fff; background:#f7c948; color:#1a1a2e; }

        .story-read-container { max-width:820px; margin:0 auto; padding:24px 20px 40px; min-height:70vh; }

        /* 顶部返回链接（外部） */
        .top-nav { margin-bottom:16px; }
        .top-nav a { display:inline-flex; align-items:center; gap:6px; color:#666; text-decoration:none; font-weight:600; font-size:15px; transition:0.2s; }
        .top-nav a:hover { color:#1a1a2e; }

        /* 详情头部 */
        .detail-hero { background:#fff; border-radius:24px; overflow:hidden; box-shadow:0 4px 20px rgba(0,0,0,0.06); margin-bottom:28px; }
        .detail-cover { width:100%; aspect-ratio:16/7; background:linear-gradient(145deg,#2d2d44,#1a1a2e); display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
        .detail-cover img { width:100%; height:100%; object-fit:cover; }
        .detail-cover .cover-emoji { font-size:64px; opacity:0.5; }

        .detail-info { padding:24px 28px 28px; }
        .detail-info .title { font-size:26px; font-weight:800; color:#1a1a2e; margin-bottom:2px; }
        .detail-info .author { font-size:16px; color:#888; margin-bottom:12px; }
        .detail-info .desc { font-size:16px; color:#555; line-height:1.7; margin-bottom:16px; padding:14px 18px; background:#f8f6f2; border-radius:12px; border-left:4px solid #f7c948; }
        .detail-info .meta-row { display:flex; gap:24px; flex-wrap:wrap; font-size:14px; color:#888; align-items:center; }
        .detail-info .meta-row .likes { display:flex; align-items:center; gap:8px; }
        .detail-info .meta-row .likes .heart-btn { background:none; border:none; cursor:pointer; font-size:22px; color:#ccc; transition:0.2s; padding:0; line-height:1; }
        .detail-info .meta-row .likes .heart-btn:hover { transform:scale(1.1); }
        .detail-info .meta-row .likes .heart-btn.liked { color:#e74c5e; }
        .detail-info .meta-row .updated-time { color:#bbb; font-size:13px; }

        /* 章节列表 */
        .chapter-list { background:#fff; border-radius:24px; box-shadow:0 4px 20px rgba(0,0,0,0.06); overflow:hidden; }
        .chapter-list-header { padding:18px 24px; font-weight:700; font-size:18px; color:#1a1a2e; border-bottom:1px solid #f0ede8; display:flex; justify-content:space-between; align-items:center; }
        .chapter-list-header .count { font-weight:400; font-size:14px; color:#999; }

        .chapter-item { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; border-bottom:1px solid #f5f2ed; cursor:pointer; transition:background 0.15s; }
        .chapter-item:hover { background:#faf8f5; }
        .chapter-item:last-child { border-bottom:none; }
        .chapter-item .left { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
        .chapter-item .num { font-size:14px; font-weight:700; color:#ccc; min-width:32px; }
        .chapter-item .ch-title { font-size:16px; font-weight:600; color:#1a1a2e; }
        .chapter-item .ch-preview { font-size:14px; color:#999; margin-left:8px; font-weight:400; }
        .chapter-item .arrow { color:#ccc; font-size:18px; transition:0.2s; }
        .chapter-item:hover .arrow { color:#888; transform:translateX(4px); }

        /* 阅读模式 */
        .reader-mode .detail-hero { display:none; }
        .reader-mode .chapter-list { display:none; }
        .reader-mode .reader-content { display:block; }

        .reader-content { display:none; background:#fff; border-radius:24px; padding:32px 36px; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
        .reader-content .reader-chapter-label { font-size:14px; color:#888; margin-bottom:20px; }
        .reader-content .reader-body { font-size:18px; line-height:2; color:#2c2c2c; white-space:pre-wrap; font-family:'Georgia','Times New Roman',serif; }
        .reader-content .reader-body p { margin-bottom:1.2em; text-indent:2em; }
        .reader-nav { display:flex; justify-content:space-between; margin-top:28px; padding-top:20px; border-top:1px solid #eee; }
        .reader-nav a { padding:8px 24px; border:1px solid #ddd; border-radius:30px; text-decoration:none; font-size:14px; font-weight:600; color:#333; transition:0.2s; }
        .reader-nav a:hover { background:#1a1a2e; color:#fff; border-color:#1a1a2e; }
        .reader-nav a.disabled { opacity:0.3; pointer-events:none; }
        .reader-nav .indicator { font-size:14px; color:#888; display:flex; align-items:center; }

        /* 回到顶部按钮 */
        .back-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #1a1a2e;
            color: #fff;
            border: none;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            transition: 0.2s;
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.8;
        }
        .back-to-top:hover {
            background: #f7c948;
            color: #1a1a2e;
            transform: scale(1.05);
            opacity: 1;
        }

        .empty-state { text-align:center; padding:40px 20px; color:#aaa; }

        @media (max-width:600px) {
            .detail-info { padding:18px; }
            .detail-info .title { font-size:21px; }
            .detail-info .desc { font-size:14px; padding:12px; }
            .chapter-item { padding:14px 16px; }
            .chapter-item .ch-title { font-size:14px; }
            .chapter-item .ch-preview { display:none; }
            .reader-content { padding:20px; }
            .reader-content .reader-body { font-size:16px; line-height:1.9; }
            .reader-nav { flex-wrap:wrap; gap:8px; justify-content:center; }
            .back-to-top { bottom:20px; right:20px; width:42px; height:42px; font-size:20px; }
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <div class="logo">Montainment</div>
            <ul>
                <li><a href="index.html">首页</a></li>
                <li><a href="quiz.html">语言测验</a></li>
                <li><a href="game.html">游戏</a></li>
                <li><a href="story.html" class="active">故事工坊</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="story-read-container" id="app">

            <!-- 顶部返回链接（外部，根据模式切换） -->
            <div class="top-nav" id="topNav">
                <a href="#" id="backLink">← 返回小说列表</a>
            </div>

            <!-- 小说详情模式（目录模式） -->
            <div id="detailView">
                <div class="detail-hero" id="detailHero"></div>
                <div class="chapter-list" id="chapterList">
                    <div class="chapter-list-header">
                        <span>📖 章节列表</span>
                        <span class="count" id="chapterCount">0 章</span>
                    </div>
                    <div id="chapterItems"></div>
                </div>
            </div>

            <!-- 阅读模式 -->
            <div class="reader-content" id="readerContent">
                <div class="reader-chapter-label" id="readerChapterLabel"></div>
                <div class="reader-body" id="readerBody"></div>
                <div class="reader-nav">
                    <a href="#" id="readerPrev" class="disabled">上一章</a>
                    <span class="indicator" id="readerIndicator">1 / 1</span>
                    <a href="#" id="readerNext" class="disabled">下一章</a>
                </div>
            </div>

        </div>
    </main>

    <!-- 回到顶部按钮（固定） -->
    <button class="back-to-top" id="backToTopBtn" aria-label="回到顶部">↑</button>

    <script>
        // ================================================================
        //  story-read.html —— 小说详情 + 阅读
        //  支持点赞（localStorage持久化，toggle）
        //  支持跳转阅读（通过 URL 参数 chapter）
        // ================================================================

        const detailHero = document.getElementById('detailHero');
        const chapterItems = document.getElementById('chapterItems');
        const chapterCount = document.getElementById('chapterCount');
        const detailView = document.getElementById('detailView');

        const readerContent = document.getElementById('readerContent');
        const readerChapterLabel = document.getElementById('readerChapterLabel');
        const readerBody = document.getElementById('readerBody');
        const readerPrev = document.getElementById('readerPrev');
        const readerNext = document.getElementById('readerNext');
        const readerIndicator = document.getElementById('readerIndicator');

        const backLink = document.getElementById('backLink');
        const topNav = document.getElementById('topNav');

        const backToTopBtn = document.getElementById('backToTopBtn');

        // 当前小说数据
        let currentStory = null;
        let currentChapterIndex = 0;

        // ---------- localStorage 工具 ----------
        function getLikes(storyId) {
            const val = localStorage.getItem('story_likes_' + storyId);
            return val !== null ? parseInt(val, 10) : null;
        }
        function setLikes(storyId, count) {
            localStorage.setItem('story_likes_' + storyId, String(count));
        }

        // ---------- 获取 URL 参数 ----------
        function getParam(name) {
            const url = new URL(window.location.href);
            return url.searchParams.get(name);
        }

        // ---------- 渲染详情（目录模式） ----------
        function renderDetail(story) {
            currentStory = story;

            // 设置返回链接为“返回小说列表”
            backLink.textContent = '← 返回小说列表';
            backLink.href = 'story.html';

            let likes = getLikes(story.id);
            if (likes === null) {
                likes = story.likes || 0;
                setLikes(story.id, likes);
            }

            const hasCover = story.cover && story.cover.trim() !== '';
            const coverEmoji = getCoverEmoji(story.title);
            const coverColor = getCoverColor(story.title);
            const coverHtml = hasCover ? `<img src="${story.cover}" alt="${story.title}" />` : `<span class="cover-emoji">${coverEmoji}</span>`;

            detailHero.innerHTML = `
                <div class="detail-cover" style="background:${hasCover ? '#1a1a2e' : coverColor};">
                    ${coverHtml}
                </div>
                <div class="detail-info">
                    <div class="title">${story.title}</div>
                    <div class="author">作者：${story.author || '未知作者'}</div>
                    <div class="desc">${story.description || '📝 暂无简介'}</div>
                    <div class="meta-row">
                        <span class="likes">
                            <button class="heart-btn" id="likeBtn" data-story-id="${story.id}">❤️</button>
                            <span id="likeCount">${likes}</span>
                        </span>
                        <span>📖 ${story.chapters ? story.chapters.length : 0} 章</span>
                        <span class="updated-time">🕒 更新于 ${formatTime(story.updatedAt)}</span>
                    </div>
                </div>
            `;

            // 绑定点赞事件
            const likeBtn = document.getElementById('likeBtn');
            const likeSpan = document.getElementById('likeCount');
            likeBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleLike(story.id, likeBtn, likeSpan);
            });

            // 章节列表
            const chapters = story.chapters || [];
            chapterCount.textContent = chapters.length + ' 章';
            if (chapters.length === 0) {
                chapterItems.innerHTML = `<div style="padding:32px 24px;text-align:center;color:#aaa;font-size:15px;">📝 暂无章节，请等待更新</div>`;
                return;
            }

            let chHtml = '';
            chapters.forEach((ch, i) => {
                const preview = ch.content ? ch.content.substring(0, 40) + (ch.content.length > 40 ? '...' : '') : '';
                chHtml += `
                    <div class="chapter-item" data-chapter="${i}">
                        <div class="left">
                            <span class="num">${String(i+1).padStart(2,'0')}</span>
                            <span class="ch-title">${ch.title || '第' + (i+1) + '章'}</span>
                            <span class="ch-preview">${preview}</span>
                        </div>
                        <span class="arrow">›</span>
                    </div>
                `;
            });
            chapterItems.innerHTML = chHtml;

            // 点击章节跳转到阅读模式（带 chapter 参数）
            chapterItems.querySelectorAll('.chapter-item').forEach(el => {
                el.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.chapter);
                    window.location.href = `story-read.html?story=${story.id}&chapter=${idx}`;
                });
            });
        }

        // ---------- 阅读模式 ----------
        function renderReader(story, chapterIdx) {
            if (!story || !story.chapters || chapterIdx >= story.chapters.length) {
                // 如果 chapter 无效，回到详情模式
                document.body.classList.remove('reader-mode');
                detailView.style.display = 'block';
                readerContent.style.display = 'none';
                // 恢复返回链接为“返回小说列表”
                backLink.textContent = '← 返回小说列表';
                backLink.href = 'story.html';
                return;
            }

            document.body.classList.add('reader-mode');
            detailView.style.display = 'none';
            readerContent.style.display = 'block';

            // 设置返回链接为“返回目录”
            backLink.textContent = '← 返回目录';
            backLink.href = `story-read.html?story=${story.id}`;

            const ch = story.chapters[chapterIdx];
            readerChapterLabel.textContent = ch.title || '第' + (chapterIdx+1) + '章';
            readerBody.textContent = ch.content || '(内容为空)';

            const total = story.chapters.length;
            readerIndicator.textContent = `${chapterIdx+1} / ${total}`;

            readerPrev.href = chapterIdx > 0 ? `story-read.html?story=${story.id}&chapter=${chapterIdx-1}` : '#';
            readerPrev.classList.toggle('disabled', chapterIdx === 0);

            readerNext.href = chapterIdx < total-1 ? `story-read.html?story=${story.id}&chapter=${chapterIdx+1}` : '#';
            readerNext.classList.toggle('disabled', chapterIdx === total-1);

            // 键盘左右键导航
            document.removeEventListener('keydown', handleKeydown);
            document.addEventListener('keydown', handleKeydown);
        }

        function handleKeydown(e) {
            if (e.key === 'ArrowLeft') {
                const link = readerPrev.href;
                if (link && link !== '#') window.location.href = link;
            } else if (e.key === 'ArrowRight') {
                const link = readerNext.href;
                if (link && link !== '#') window.location.href = link;
            }
        }

        // ---------- 点赞 toggle ----------
        function toggleLike(storyId, btn, span) {
            let likes = getLikes(storyId);
            if (likes === null) likes = 0;

            const flagKey = 'story_liked_' + storyId;
            const liked = localStorage.getItem(flagKey) === 'true';

            if (liked) {
                likes = Math.max(0, likes - 1);
                localStorage.setItem(flagKey, 'false');
                btn.classList.remove('liked');
            } else {
                likes = likes + 1;
                localStorage.setItem(flagKey, 'true');
                btn.classList.add('liked');
            }

            setLikes(storyId, likes);
            span.textContent = likes;
        }

        // ---------- 工具函数 ----------
        function getCoverEmoji(title) {
            const map = {
                '灰':'🏚️','星':'⭐','魔':'🔮','时':'⏳','风':'🌪️','火':'🔥','水':'💧','暗':'🌙','光':'☀️','梦':'🌌',
                '剑':'⚔️','龙':'🐉','凤':'🦅','雪':'❄️','月':'🌙','海':'🌊','山':'⛰️','森':'🌲','林':'🌳','城':'🏰',
                '塔':'🗼','桥':'🌉','夜':'🌃','晨':'🌅','宇':'🌌','宙':'🌠','未':'🔮','来':'🚀','古':'🏛️','老':'🕰️',
                '新':'✨','世':'🌍','界':'🌎','王':'👑','骑':'🐴','勇':'🛡️','士':'⚔️','法':'📜','师':'🧙','猎':'🏹',
                '人':'🧑','神':'⚡','妖':'🌸','怪':'👾','灵':'👻','魂':'💫','血':'🩸','骨':'💀','瞳':'👁️','翼':'🦇',
                '心':'❤️','意':'🧠','念':'💭','情':'💝','爱':'💖','生':'🌱','死':'🕊️','命':'🌀','运':'🎲','真':'💎',
                '美':'🌸','善':'😇','恶':'👿','明':'🌞','白':'⬜','黑':'⬛','红':'🔴','蓝':'🔵','绿':'🟢','黄':'🟡',
                '金':'🪙','银':'🥈','宝':'💎','钱':'💰','财':'🏦'
            };
            return map[title.charAt(0)] || '📖';
        }

        function getCoverColor(title) {
            const colors = [
                'linear-gradient(145deg,#2d2d44,#1a1a2e)',
                'linear-gradient(145deg,#3d2d44,#2a1a2e)',
                'linear-gradient(145deg,#2d3d44,#1a2a2e)',
                'linear-gradient(145deg,#443d2d,#2e2a1a)',
                'linear-gradient(145deg,#442d3d,#2e1a2a)',
                'linear-gradient(145deg,#2d443d,#1a2e2a)',
                'linear-gradient(145deg,#3d2d44,#2a1a3e)',
                'linear-gradient(145deg,#3d442d,#2a2e1a)',
            ];
            let hash = 0;
            for (let i = 0; i < title.length; i++) hash = title.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        function formatTime(iso) {
            if (!iso) return '未知';
            const d = new Date(iso);
            return d.toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
        }

        // ================================================================
        //  回到顶部按钮
        // ================================================================
        backToTopBtn.addEventListener('click', function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ================================================================
        //  主逻辑：加载数据，根据参数决定显示详情还是阅读
        // ================================================================

        function loadStory() {
            const storyId = getParam('story');
            if (!storyId) {
                window.location.href = 'story.html';
                return;
            }

            fetch('data/stories.json')
                .then(res => {
                    if (!res.ok) throw new Error('stories.json 不存在');
                    return res.json();
                })
                .then(data => {
                    const stories = data.stories || [];
                    const story = stories.find(s => String(s.id) === storyId);
                    if (!story) {
                        throw new Error('找不到该小说');
                    }

                    if (getLikes(story.id) === null) {
                        setLikes(story.id, story.likes || 0);
                    }

                    const chapterIdx = getParam('chapter');
                    if (chapterIdx !== null) {
                        const idx = parseInt(chapterIdx, 10);
                        if (!isNaN(idx) && story.chapters && idx < story.chapters.length) {
                            // 进入阅读模式
                            renderDetail(story); // 先渲染详情（用于数据准备）
                            renderReader(story, idx);
                            return;
                        }
                    }

                    // 否则显示详情模式
                    document.body.classList.remove('reader-mode');
                    detailView.style.display = 'block';
                    readerContent.style.display = 'none';
                    // 恢复返回链接为“返回小说列表”
                    backLink.textContent = '← 返回小说列表';
                    backLink.href = 'story.html';
                    renderDetail(story);
                })
                .catch(err => {
                    console.error('加载失败:', err);
                    document.getElementById('detailHero').innerHTML = `
                        <div style="padding:40px;text-align:center;color:#d14c4c;">
                            <div style="font-size:48px;">⚠️</div>
                            <h3>加载失败</h3>
                            <p>${err.message}</p>
                            <a href="story.html" style="display:inline-block;margin-top:16px;padding:10px 28px;background:#0b1c33;color:#fff;border-radius:30px;text-decoration:none;">返回列表</a>
                        </div>
                    `;
                    document.getElementById('chapterItems').innerHTML = '';
                    chapterCount.textContent = '0 章';
                });
        }

        loadStory();
    </script>

</body>
</html>
