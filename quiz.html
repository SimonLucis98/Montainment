<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>语言测验 · 多语言学习 | Montainment</title>
  <meta name="description" content="选择语言、难度，开始词汇测验。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">
        <span class="brand-mark">✦</span>
        Montainment
      </a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="quiz.html">语言测验</a></li>
        <li><a href="game.html">游戏</a></li>
        <li><a href="story.html">故事工坊</a></li>
      </ul>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="ad-slot ad-slot--banner" data-ad-slot="quiz-top-banner" style="margin-top:16px;">
        <span>广告位 · 728×90</span>
      </div>
    </div>

    <div class="page-header container">
      <span class="page-badge badge-primary">语言测验</span>
      <h1>🌍 选择语言 · 开始挑战</h1>
      <p>先选择要学习的语言，再选择难度，最后挑选试卷。</p>
    </div>

    <div class="container">
      <section class="quiz-panel" id="quiz-panel">

        <!-- 顶部信息条：题号 / 进度条 / 得分 -->
        <div class="quiz-topbar">
          <span id="quiz-index">🌍 选择语言</span>
          <div class="quiz-progress">
            <div class="quiz-progress-bar" id="quiz-progress-bar"></div>
          </div>
          <span class="quiz-score">得分：<span id="quiz-score">0</span></span>
        </div>

        <!-- 语言切换按钮（界面语言）会由 JS 动态插入 -->
        <div id="lang-toggle-placeholder"></div>

        <!-- 动态内容区域 -->
        <div id="quiz-body"></div>

        <!-- 反馈 -->
        <div class="quiz-feedback" id="quiz-feedback"></div>

        <!-- 操作按钮 -->
        <div class="quiz-actions">
          <button class="btn btn-primary" id="quiz-next-btn" style="display:none;">下一题 →</button>
        </div>
      </section>

      <div class="ad-slot ad-slot--inline" data-ad-slot="quiz-inline">
        <span>广告位 · 内容间横幅</span>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Montainment · 一个让学习更好玩的静态网站</div>
  </footer>

  <script src="common.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
