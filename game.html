<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏大厅 · Montainment</title>
  <meta name="description" content="选择你喜欢的游戏，开始挑战！" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .game-hall { max-width: 1400px; margin: 0 auto; padding: 0 24px; }  /* ← 从 900px → 1400px */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));  /* 卡片大小不变 */
      gap: 24px;
      margin-top: 8px;
    }
    .game-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      position: relative;
      border-top: 4px solid;
      border-image: linear-gradient(90deg, #8a9b7a, #d4b87a, #c97a6b) 1;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
    }
    .game-cover {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(145deg, #2d2d44, #1a1a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      color: rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .game-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-cover .cover-icon {
      font-size: 52px;
      opacity: 0.6;
    }
    .game-cover .cover-badge {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 14px;
      border-radius: 20px;
    }
    .game-card-body {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .game-card-body .title {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .game-card-body .desc {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      flex: 1;
      margin: 4px 0 12px;
    }
    .game-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f0ede8;
      padding-top: 12px;
      gap: 8px;
    }
    .game-card-footer .footer-left {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .game-card-footer .status {
      font-size: 13px;
      color: #aaa;
      background: #f5f2ed;
      padding: 2px 14px;
      border-radius: 20px;
    }
    .game-card-footer .play-hint {
      font-size: 13px;
      color: #2a6df4;
      font-weight: 600;
      white-space: nowrap;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .empty-state .icon {
      font-size: 56px;
      margin-bottom: 12px;
    }
    .empty-state h3 {
      font-size: 20px;
      color: #666;
    }
    .external-badge {
      font-size: 11px;
      background: #f7c948;
      color: #0b1c33;
      padding: 1px 12px;
      border-radius: 20px;
      font-weight: 700;
      margin-left: 6px;
    }

    /* 🆕 平台徽章 */
    .platform-badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      background: #eef2f7;
      color: #6b7a8f;
      white-space: nowrap;
    }
    .platform-badge.all { background: #e6f7ee; color: #1f8b4c; }
    .platform-badge.desktop { background: #e6f0ff; color: #2a6df4; }
    .platform-badge.landscape { background: #fff4d6; color: #a06a00; }

    /* 🆕 平台提示弹窗 */
    .platform-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 28, 51, 0.55);
      -webkit-backdrop-filter: blur(6px);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 20px;
    }
    .platform-modal-overlay.active { display: flex; }
    .platform-modal-box {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.25);
      animation: platformModalPop 0.28s ease;
    }
    @keyframes platformModalPop {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .platform-modal-icon {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 12px;
    }
    .platform-modal-box h3 {
      font-size: 18px;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 10px;
    }
    .platform-modal-box p {
      font-size: 14px;
      color: #666;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .platform-modal-actions {
      display: flex;
      gap: 10px;
    }
    .platform-modal-btn {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      transition: 0.2s;
    }
    .platform-modal-btn.secondary {
      background: #f0ede8;
      color: #666;
    }
    .platform-modal-btn.secondary:hover { background: #e6e2db; }
    .platform-modal-btn.primary {
      background: #1a1a2e;
      color: #fff;
    }
    .platform-modal-btn.primary:hover {
      background: #2d2d44;
      transform: translateY(-1px);
    }

    /* ===== 响应式：卡片保持 260px 最小宽度，容器自动适配 ===== */
    @media (max-width: 1480px) {
      .game-hall { max-width: 1160px; }  /* 5列 → 4列 (260×4 + 24×3 = 1112) */
    }
    @media (max-width: 1200px) {
      .game-hall { max-width: 900px; }   /* 4列 → 3列 (260×3 + 24×2 = 828) */
    }
    @media (max-width: 860px) {
      .game-hall { max-width: 600px; }   /* 3列 → 2列 (260×2 + 24 = 544) */
    }
    @media (max-width: 600px) {
      .game-hall { max-width: 100%; padding: 0 16px; }
      .game-grid {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .game-card-body .title {
        font-size: 15px;
      }
      .game-card-body .desc {
        font-size: 13px;
      }
      .game-cover {
        aspect-ratio: 16 / 9;
      }
      .game-cover .cover-icon {
        font-size: 36px;
      }
    }
    @media (max-width: 420px) {
      .game-grid {
        gap: 10px;
      }
      .game-card-body {
        padding: 12px;
      }
      .game-card-body .title {
        font-size: 13px;
      }
      .game-card-body .desc {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">
        <span class="brand-mark">✦</span>
        Montainment · 蒙堂木下
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">首页</a></li>
        <li><a href="quiz.html" data-i18n="nav.quiz">语言测验</a></li>
        <li><a href="game.html" class="active" data-i18n="nav.game">游戏</a></li>
        <li><a href="story.html" data-i18n="nav.story">故事工坊</a></li>
        <li><a href="immersive.html" data-i18n="nav.immersive">🌙 沉浸式工坊</a></li>
      </ul>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
    </nav>
  </header>

  <main>
    <div class="page-header container">
      <span class="page-badge badge-sunshine" data-i18n="game.badge">🎮 游戏大厅</span>
      <h1 data-i18n="game.title">选择游戏 · 开始挑战</h1>
      <p data-i18n="game.desc">点击任意游戏卡片，进入独立游戏页面，享受完整游戏体验！</p>
    </div>

    <div class="game-hall">
      <div class="game-grid" id="gameGrid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" data-i18n="common.footer">© 2026 Montainment · 蒙堂木下 · 一个让学习更好玩的静态网站</div>
  </footer>

  <!-- 🆕 平台提示弹窗 -->
  <div class="platform-modal-overlay" id="platformModal">
    <div class="platform-modal-box">
      <div class="platform-modal-icon" id="platformModalIcon">💻</div>
      <h3 id="platformModalTitle">此游戏建议在电脑上玩</h3>
      <p id="platformModalDesc">该游戏需要键盘或大屏幕操作。</p>
      <div class="platform-modal-actions">
        <button type="button" class="platform-modal-btn secondary" id="platformModalBack">返回大厅</button>
        <button type="button" class="platform-modal-btn primary" id="platformModalContinue">仍要继续</button>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    (function() {
      const gameGrid = document.getElementById('gameGrid');
      let allGames = [];

      function getLang() {
        return window.i18n ? i18n.currentLang : 'en';
      }

      // 🆕 是否手机/平板等触屏设备
      function isMobileDevice() {
        const ua = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        const narrow = window.innerWidth < 900;
        return ua || (coarse && narrow);
      }

      // 🆕 平台信息（徽章文字 + 颜色 key）
      function getPlatformInfo(game) {
        const platform = game.platform || 'all';
        const lang = getLang();
        const map = {
          all:       { icon: '🎮', zh: '双端可玩', en: 'All devices' },
          desktop:   { icon: '💻', zh: '仅电脑',   en: 'Desktop only' },
          landscape: { icon: '📱', zh: '建议横屏', en: 'Landscape better' }
        };
        const info = map[platform] || map.all;
        return {
          key: platform,
          icon: info.icon,
          label: lang === 'zh' ? info.zh : info.en
        };
      }

      function getCoverDisplay(game) {
        if (game.cover) {
          return `<img src="${game.cover}" alt="${game.titleZh}" />`;
        }
        return `<span class="cover-icon">${game.icon || '🎮'}</span>`;
      }

      function getCoverColor(game) {
        const colors = [
          'linear-gradient(145deg, #2d2d44, #1a1a2e)',
          'linear-gradient(145deg, #3d2d44, #2a1a2e)',
          'linear-gradient(145deg, #2d3d44, #1a2a2e)',
          'linear-gradient(145deg, #443d2d, #2e2a1a)',
          'linear-gradient(145deg, #442d3d, #2e1a2a)',
          'linear-gradient(145deg, #2d443d, #1a2e2a)',
        ];
        let hash = 0;
        const str = game.id || game.titleZh || '';
        for (let i = 0; i < str.length; i++) {
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
      }

      function renderList(games) {
        allGames = games;
        if (games.length === 0) {
          gameGrid.innerHTML = `
            <div style="grid-column:1/-1;">
              <div class="empty-state">
                <div class="icon">🎮</div>
                <h3 data-i18n="game.empty_title">暂无游戏</h3>
                <p data-i18n="game.empty_desc">请在后台添加游戏内容 🚧</p>
              </div>
            </div>
          `;
          if (typeof applyI18n === 'function') applyI18n();
          return;
        }

        const lang = getLang();
        let html = '';
        games.forEach((game) => {
          const coverHtml = getCoverDisplay(game);
          const coverColor = getCoverColor(game);
          const title = lang === 'zh' ? game.titleZh : (game.titleEn || game.titleZh);
          const desc = lang === 'zh' ? (game.descriptionZh || '📝 来挑战吧！') : (game.descriptionEn || game.descriptionZh || '📝 Let\'s go!');

          const isExternal = game.type === 'external' || game.type === 'redirect';
          const linkUrl = isExternal ? game.entry : `game-play.html?game=${encodeURIComponent(game.id)}`;
          const linkTarget = isExternal ? 'target="_blank"' : '';

          const externalBadge = isExternal ? `<span class="external-badge">${window.i18n ? i18n.t('game.external_badge') : '🔗 外部'}</span>` : '';

          let typeKey = '';
          if (game.type === 'js') {
            typeKey = 'game.type_js';
          } else if (game.type === 'iframe') {
            typeKey = 'game.type_iframe';
          } else if (isExternal) {
            typeKey = 'game.type_external';
          } else {
            typeKey = 'game.type_unknown';
          }
          const typeLabel = window.i18n ? i18n.t(typeKey) : (lang === 'zh' ? '未知类型' : 'Unknown');

          const playHint = isExternal ? 
            (lang === 'zh' ? '前往游玩 →' : 'Play Now →') : 
            (lang === 'zh' ? '开始游戏 →' : 'Start Game →');

          // 🆕 平台徽章
          const platformInfo = getPlatformInfo(game);
          const platformBadge = `<span class="platform-badge ${platformInfo.key}">${platformInfo.icon} ${platformInfo.label}</span>`;

          html += `
            <a href="${linkUrl}" ${linkTarget} class="game-card" data-platform="${platformInfo.key}" data-game-id="${game.id}">
              <div class="game-cover" style="background:${coverColor};">
                ${coverHtml}
                <span class="cover-badge">${typeLabel}</span>
              </div>
              <div class="game-card-body">
                <div class="title">${title} ${externalBadge}</div>
                <div class="desc">${desc}</div>
                <div class="game-card-footer">
                  <div class="footer-left">
                    <span class="status">${typeLabel}</span>
                    ${platformBadge}
                  </div>
                  <span class="play-hint">${playHint}</span>
                </div>
              </div>
            </a>
          `;
        });

        gameGrid.innerHTML = html;
        if (typeof applyI18n === 'function') applyI18n();
      }

      // 🆕 手机点桌面游戏 → 弹提示
      function showPlatformModal(game) {
        const lang = getLang();
        const modal = document.getElementById('platformModal');
        const titleEl = document.getElementById('platformModalTitle');
        const descEl = document.getElementById('platformModalDesc');
        const backBtn = document.getElementById('platformModalBack');
        const continueBtn = document.getElementById('platformModalContinue');
        const iconEl = document.getElementById('platformModalIcon');

        const gameTitle = lang === 'zh'
          ? (game.titleZh || game.titleEn || '')
          : (game.titleEn || game.titleZh || '');

        iconEl.textContent = '💻';
        if (lang === 'zh') {
          titleEl.textContent = '此游戏建议在电脑上玩';
          descEl.textContent = `《${gameTitle}》需要键盘或大屏幕操作，手机上可能无法正常游玩。你可以用电脑打开，或仍要继续尝试。`;
          backBtn.textContent = '返回大厅';
          continueBtn.textContent = '仍要继续';
        } else {
          titleEl.textContent = 'This game is best on desktop';
          descEl.textContent = `"${gameTitle}" requires a keyboard or larger screen. You can open it on a desktop, or continue anyway.`;
          backBtn.textContent = 'Back';
          continueBtn.textContent = 'Continue anyway';
        }

        modal._gameId = game.id;
        modal.classList.add('active');
      }

      function hidePlatformModal() {
        document.getElementById('platformModal').classList.remove('active');
      }

      // 🆕 卡片点击拦截（捕获阶段）
      gameGrid.addEventListener('click', function(e) {
        const card = e.target.closest('a.game-card');
        if (!card) return;
        if (!isMobileDevice()) return;
        if (card.dataset.platform !== 'desktop') return;

        e.preventDefault();
        e.stopPropagation();

        const gameId = card.dataset.gameId;
        const game = allGames.find(g => String(g.id) === String(gameId));
        if (game) showPlatformModal(game);
      }, true);

      // 🆕 弹窗按钮
      document.getElementById('platformModalBack').addEventListener('click', function() {
        hidePlatformModal();
      });
      document.getElementById('platformModalContinue').addEventListener('click', function() {
        const modal = document.getElementById('platformModal');
        const gameId = modal._gameId;
        hidePlatformModal();
        if (gameId != null) {
          window.location.href = `game-play.html?game=${encodeURIComponent(gameId)}`;
        }
      });
      document.getElementById('platformModal').addEventListener('click', function(e) {
        if (e.target === this) hidePlatformModal();
      });
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') hidePlatformModal();
      });

      function loadGames() {
        fetch('data/games.json')
          .then(res => {
            if (!res.ok) throw new Error('games.json 不存在');
            return res.json();
          })
          .then(data => {
            const games = (data.games || [])
              .filter(g => g.enabled !== false)
              .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
            renderList(games);
          })
          .catch(err => {
            console.warn('加载游戏数据失败:', err);
            renderList([]);
          });
      }

      window.loadGames = loadGames;

      document.addEventListener('languageChanged', function() {
        if (allGames.length > 0) {
          renderList(allGames);
        } else {
          loadGames();
        }
      });

      loadGames();
    })();
  </script>

</body>
</html>
