<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏大厅 · Montainment</title>
  <meta name="description" content="选择你喜欢的游戏，开始挑战！" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ========== 游戏大厅样式 ========== */
    .game-hall { max-width: 900px; margin: 0 auto; }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 8px;
    }

    .game-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
    }

    .game-cover {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(145deg, #2d2d44, #1a1a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      color: rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .game-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-cover .cover-icon { font-size: 52px; opacity: 0.6; }
    .game-cover .cover-badge {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0,0,0,0.4);
      padding: 2px 14px;
      border-radius: 20px;
    }

    .game-card-body {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .game-card-body .title {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .game-card-body .desc {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      flex: 1;
      margin: 4px 0 12px;
    }
    .game-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f0ede8;
      padding-top: 12px;
    }
    .game-card-footer .status {
      font-size: 13px;
      color: #aaa;
      background: #f5f2ed;
      padding: 2px 14px;
      border-radius: 20px;
    }
    .game-card-footer .play-hint {
      font-size: 13px;
      color: #2a6df4;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .empty-state .icon { font-size: 56px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 20px; color: #666; }

    @media (max-width: 600px) {
      .game-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
      .game-card-body .title { font-size: 15px; }
      .game-card-body .desc { font-size: 13px; }
      .game-cover { aspect-ratio: 16 / 9; }
      .game-cover .cover-icon { font-size: 36px; }
    }
    @media (max-width: 420px) {
      .game-grid { gap: 10px; }
      .game-card-body { padding: 12px; }
      .game-card-body .title { font-size: 13px; }
      .game-card-body .desc { font-size: 12px; }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand"><span class="brand-mark">✦</span> Montainment</a>
      <ul class="nav-links">
        <li><a href="index.html">首页</a></li>
        <li><a href="quiz.html">语言测验</a></li>
        <li><a href="game.html" class="active">游戏大厅</a></li>
        <li><a href="story.html">故事工坊</a></li>
      </ul>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="ad-slot ad-slot--banner" data-ad-slot="game-top-banner" style="margin-top:16px;">
        <span>广告位 · 728×90</span>
      </div>
    </div>

    <div class="page-header container">
      <span class="page-badge badge-sunshine">🎮 游戏大厅</span>
      <h1>选择游戏 · 开始挑战</h1>
      <p>点击任意游戏卡片，进入独立游戏页面，享受完整广告体验！</p>
    </div>

    <div class="container game-hall">
      <div class="game-grid" id="gameGrid"></div>
      <div class="ad-slot ad-slot--inline" data-ad-slot="game-inline" style="margin-top:24px;">
        <span>广告位 · 内容间横幅</span>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© 2026 Montainment · 一个让学习更好玩的静态网站</div>
  </footer>

  <script src="common.js"></script>
  <script>
    // ================================================================
    //  游戏大厅：从 data/games.json 加载，点击跳转到 game-play.html
    // ================================================================
    (function() {
      const gameGrid = document.getElementById('gameGrid');

      function getCoverDisplay(game) {
        if (game.image) {
          return `<img src="${game.image}" alt="${game.titleZh}" />`;
        }
        return `<span class="cover-icon">${game.icon || '🎮'}</span>`;
      }

      function getCoverColor(game) {
        const colors = [
          'linear-gradient(145deg, #2d2d44, #1a1a2e)',
          'linear-gradient(145deg, #3d2d44, #2a1a2e)',
          'linear-gradient(145deg, #2d3d44, #1a2a2e)',
          'linear-gradient(145deg, #443d2d, #2e2a1a)',
          'linear-gradient(145deg, #442d3d, #2e1a2a)',
          'linear-gradient(145deg, #2d443d, #1a2e2a)',
        ];
        let hash = 0;
        const str = game.id || game.titleZh || '';
        for (let i = 0; i < str.length; i++) {
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
      }

      function renderList(games) {
        if (games.length === 0) {
          gameGrid.innerHTML = `
            <div style="grid-column:1/-1;">
              <div class="empty-state"><div class="icon">🎮</div><h3>暂无游戏</h3><p>请在后台添加游戏内容 🚧</p></div>
            </div>
          `;
          return;
        }

        let html = '';
        games.forEach((game) => {
          const coverHtml = getCoverDisplay(game);
          const coverColor = getCoverColor(game);
          const typeLabel = game.type === 'js' ? '原生游戏' : 'H5 游戏';
          const desc = game.descriptionZh || '📝 来挑战吧！';

          html += `
            <a href="game-play.html?game=${encodeURIComponent(game.id)}" class="game-card">
              <div class="game-cover" style="background:${coverColor};">
                ${coverHtml}
                <span class="cover-badge">${typeLabel}</span>
              </div>
              <div class="game-card-body">
                <div class="title">${game.titleZh}</div>
                <div class="desc">${desc}</div>
                <div class="game-card-footer">
                  <span class="status">${typeLabel}</span>
                  <span class="play-hint">开始游戏 →</span>
                </div>
              </div>
            </a>
          `;
        });

        gameGrid.innerHTML = html;
      }

      function loadGames() {
        fetch('data/games.json')
          .then(res => {
            if (!res.ok) throw new Error('games.json 不存在');
            return res.json();
          })
          .then(data => {
            const games = (data.games || [])
              .filter(g => g.enabled !== false)
              .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
            renderList(games);
          })
          .catch(err => {
            console.warn('加载游戏数据失败:', err);
            renderList([]);
          });
      }

      loadGames();
    })();
  </script>

</body>
</html>
