<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>游戏大厅 · Montainment</title>
  <meta name="description" content="选择你喜欢的游戏，开始挑战！" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .game-hall { max-width: 900px; margin: 0 auto; }
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
      margin-top: 8px;
    }
    .game-card {
      background: #fff;
      border-radius: 20px;
      overflow: hidden;
      position: relative;  /* ← 让卡片顶部装饰线生效 */
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }
    .game-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.10);
    }
    .game-cover {
      width: 100%;
      aspect-ratio: 16 / 10;
      background: linear-gradient(145deg, #2d2d44, #1a1a2e);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      color: rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .game-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .game-cover .cover-icon {
      font-size: 52px;
      opacity: 0.6;
    }
    .game-cover .cover-badge {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 14px;
      border-radius: 20px;
    }
    .game-card-body {
      padding: 16px 18px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .game-card-body .title {
      font-size: 17px;
      font-weight: 700;
      color: #1a1a2e;
    }
    .game-card-body .desc {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      flex: 1;
      margin: 4px 0 12px;
    }
    .game-card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #f0ede8;
      padding-top: 12px;
    }
    .game-card-footer .status {
      font-size: 13px;
      color: #aaa;
      background: #f5f2ed;
      padding: 2px 14px;
      border-radius: 20px;
    }
    .game-card-footer .play-hint {
      font-size: 13px;
      color: #2a6df4;
      font-weight: 600;
    }
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #aaa;
    }
    .empty-state .icon {
      font-size: 56px;
      margin-bottom: 12px;
    }
    .empty-state h3 {
      font-size: 20px;
      color: #666;
    }
    @media (max-width:600px) {
      .game-grid {
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }
      .game-card-body .title {
        font-size: 15px;
      }
      .game-card-body .desc {
        font-size: 13px;
      }
      .game-cover {
        aspect-ratio: 16 / 9;
      }
      .game-cover .cover-icon {
        font-size: 36px;
      }
    }
    @media (max-width:420px) {
      .game-grid {
        gap: 10px;
      }
      .game-card-body {
        padding: 12px;
      }
      .game-card-body .title {
        font-size: 13px;
      }
      .game-card-body .desc {
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">
        <span class="brand-mark">✦</span>
        Montainment
      </a>
      <ul class="nav-links">
        <li><a href="index.html" data-i18n="nav.home">首页</a></li>
        <li><a href="quiz.html" data-i18n="nav.quiz">语言测验</a></li>
        <li><a href="game.html" class="active" data-i18n="nav.game">游戏</a></li>
        <li><a href="story.html" data-i18n="nav.story">故事工坊</a></li>
      </ul>
      <button class="nav-toggle" aria-label="打开菜单" aria-expanded="false">☰</button>
    </nav>
  </header>

  <main>
    <div class="page-header container">
      <span class="page-badge badge-sunshine" data-i18n="game.badge">🎮 游戏大厅</span>
      <h1 data-i18n="game.title">选择游戏 · 开始挑战</h1>
      <p data-i18n="game.desc">点击任意游戏卡片，进入独立游戏页面，享受完整游戏体验！</p>
    </div>

    <div class="container game-hall">
      <div class="game-grid" id="gameGrid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container" data-i18n="common.footer">© 2026 Montainment · 一个让学习更好玩的静态网站</div>
  </footer>

  <script src="i18n.js"></script>
  <script src="common.js"></script>
  <script>
    (function() {
      const gameGrid = document.getElementById('gameGrid');
      let allGames = [];

      function getLang() {
        return window.i18n ? i18n.currentLang : 'en';
      }

      function getCoverDisplay(game) {
        if (game.image) {
          return `<img src="${game.image}" alt="${game.titleZh}" />`;
        }
        return `<span class="cover-icon">${game.icon || '🎮'}</span>`;
      }

      function getCoverColor(game) {
        const colors = [
          'linear-gradient(145deg, #2d2d44, #1a1a2e)',
          'linear-gradient(145deg, #3d2d44, #2a1a2e)',
          'linear-gradient(145deg, #2d3d44, #1a2a2e)',
          'linear-gradient(145deg, #443d2d, #2e2a1a)',
          'linear-gradient(145deg, #442d3d, #2e1a2a)',
          'linear-gradient(145deg, #2d443d, #1a2e2a)',
        ];
        let hash = 0;
        const str = game.id || game.titleZh || '';
        for (let i = 0; i < str.length; i++) {
          hash = str.charCodeAt(i) + ((hash << 5) - hash);
        }
        return colors[Math.abs(hash) % colors.length];
      }

      function renderList(games) {
        allGames = games;
        if (games.length === 0) {
          gameGrid.innerHTML = `
            <div style="grid-column:1/-1;">
              <div class="empty-state">
                <div class="icon">🎮</div>
                <h3 data-i18n="game.empty_title">暂无游戏</h3>
                <p data-i18n="game.empty_desc">请在后台添加游戏内容 🚧</p>
              </div>
            </div>
          `;
          if (typeof applyI18n === 'function') applyI18n();
          return;
        }

        const lang = getLang();
        let html = '';
        games.forEach((game) => {
          const coverHtml = getCoverDisplay(game);
          const coverColor = getCoverColor(game);
          const title = lang === 'zh' ? game.titleZh : (game.titleEn || game.titleZh);
          const desc = lang === 'zh' ? (game.descriptionZh || '📝 来挑战吧！') : (game.descriptionEn || game.descriptionZh || '📝 Let\'s go!');
          const typeLabel = game.type === 'js' ?
            (lang === 'zh' ? '原生游戏' : 'Native Game') :
            (lang === 'zh' ? 'H5 游戏' : 'H5 Game');

          html += `
            <a href="game-play.html?game=${encodeURIComponent(game.id)}" class="game-card">
              <div class="game-cover" style="background:${coverColor};">
                ${coverHtml}
                <span class="cover-badge">${typeLabel}</span>
              </div>
              <div class="game-card-body">
                <div class="title">${title}</div>
                <div class="desc">${desc}</div>
                <div class="game-card-footer">
                  <span class="status">${typeLabel}</span>
                  <span class="play-hint" data-i18n="game.play_hint">开始游戏 →</span>
                </div>
              </div>
            </a>
          `;
        });

        gameGrid.innerHTML = html;
        if (typeof applyI18n === 'function') applyI18n();
      }

      function loadGames() {
        fetch('data/games.json')
          .then(res => {
            if (!res.ok) throw new Error('games.json 不存在');
            return res.json();
          })
          .then(data => {
            const games = (data.games || [])
              .filter(g => g.enabled !== false)
              .sort((a, b) => (a.sortOrder || 0) - (b.sortOrder || 0));
            renderList(games);
          })
          .catch(err => {
            console.warn('加载游戏数据失败:', err);
            renderList([]);
          });
      }

      window.loadGames = loadGames;

      document.addEventListener('languageChanged', function() {
        if (allGames.length > 0) {
          renderList(allGames);
        } else {
          loadGames();
        }
      });

      loadGames();
    })();
  </script>

</body>
</html>
