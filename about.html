<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>关于我们 | Montainment</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: #f5f2ed; font-family: 'Nunito', system-ui, sans-serif; min-height: 100vh; }
    
    .legal-container { max-width: 800px; margin: 60px auto; padding: 20px 24px; color: #333; line-height: 1.8; min-height: 60vh; }
    
    /* 顶部导航与语言切换 */
    .legal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #e0dcd5; }
    .legal-header .back-link { color: #888; text-decoration: none; font-weight: 600; transition: 0.2s; }
    .legal-header .back-link:hover { color: #1a1a2e; }
    
    .lang-switch { display: flex; gap: 8px; background: #e8e4dd; padding: 4px; border-radius: 20px; }
    .lang-btn { background: transparent; border: none; padding: 6px 16px; border-radius: 16px; font-size: 13px; font-weight: 700; color: #888; cursor: pointer; transition: 0.2s; font-family: inherit; }
    .lang-btn.active { background: #fff; color: #1a1a2e; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

    /* 内容区 */
    .legal-container h1 { font-size: 32px; color: #1a1a2e; margin-bottom: 24px; }
    .legal-container h2 { font-size: 20px; color: #1a1a2e; margin: 30px 0 12px; }
    .legal-container p { margin-bottom: 16px; }
    
    /* 隐藏特定语言 */
    .lang-content { display: none; }
    .lang-content.active { display: block; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <main class="legal-container">
    
    <!-- 顶部操作栏 -->
    <div class="legal-header">
      <a href="index.html" class="back-link" id="backBtn">← 返回首页</a>
      <div class="lang-switch">
        <button class="lang-btn" data-lang="zh" onclick="switchLang('zh')">中文</button>
        <button class="lang-btn" data-lang="en" onclick="switchLang('en')">EN</button>
      </div>
    </div>

    <!-- ===== 中文内容区 ===== -->
    <div id="content-zh" class="lang-content">
      <h1>关于我们 / About Us</h1>
      <h2>欢迎来到蒙堂木下</h2>
      <!-- 👇 这里放你等下给我的中文正文 -->
      <p>（这里等下替换成你的中文内容）</p>
      
      <h2>联系方式</h2>
      <p>（这里放中文的联系方式）</p>
      <p style="font-weight: 700;">📧 Email: your-email@example.com</p>
    </div>

    <!-- ===== 英文内容区 ===== -->
    <div id="content-en" class="lang-content">
      <h1>About Us</h1>
      <h2>Welcome to MENG TALES</h2>
      <!-- 👇 这里放你等下给我的英文正文 -->
      <p>(Your English content goes here)</p>

      <h2>Contact Us</h2>
      <p>(Your English contact info goes here)</p>
      <p style="font-weight: 700;">📧 Email: your-email@example.com</p>
    </div>

  </main>

  <script src="i18n.js"></script>
  <script>
    // 初始化：获取当前语言，默认中文
    function getCurrentLang() {
      const saved = localStorage.getItem('lang');
      return saved ? saved : 'zh'; // 默认给中文，因为合规页面优先照顾国内审核
    }

    // 切换语言核心函数
    function switchLang(lang) {
      // 1. 更新按钮高亮状态
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
      });
      
      // 2. 显示对应的内容
      document.querySelectorAll('.lang-content').forEach(el => {
        el.classList.remove('active');
      });
      document.getElementById('content-' + lang).classList.add('active');

      // 3. 更新返回按钮的文字
      document.getElementById('backBtn').textContent = lang === 'zh' ? '← 返回首页' : '← Back to Home';

      // 4. 把语言记录到本地，这样全站其他页面也会同步
      localStorage.setItem('lang', lang);
    }

    // 页面加载时自动执行
    document.addEventListener('DOMContentLoaded', () => {
      switchLang(getCurrentLang());
    });
  </script>

</body>
</html>
